      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 2</summary><h2>Introduction</h2><p>Hun er Oves kone; de har bodd i rekkehusområdet i nesten fire tiår.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Morgenkaffen</h2><p>Ove lager samme mengde morgenkaffe som han og kona pleide å drikke sammen.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Dødsfallet og besøket</h2><p>I kapittel 4 blir det kjent at hun døde seks måneder tidligere. Ove planter nye rosa blomster ved henne og hvisker at han savner henne. Han fortsetter å kontrollere varmeovnene to ganger om dagen som om hun kunne ha skrudd dem opp.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Dødsfallet og besøket</h2><p>Hun pleide å lede samtalene, mens Ove for det meste svarte.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Møtet på toget og bøkene</h2><p>Ove så henne for første gang på et tog, etter fem år ved jernbanen. Senere bygde han en bokhylle til henne, som hun fylte med bøker.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Navnet og fotografiet fra Spania</h2><p>I kapittel 7 navngir Anita Oves kone som Sonja. Et nær førti år gammelt fotografi viser henne og Ove på busstur i Spania. Hun har rød kjole og er solbrun og lykkelig på bildet. Dette er en tidligere scene, ikke et nåtidsutseende.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Første møte og troen på skjebnen</h2><p>Ved første møte har Sonja røde sko, gullbrosje og gyllenbrunt hår. Hun trodde på skjebnen og at veiene i livet fører dit man er forutbestemt. Utseendet i dette tilbakeblikket tilhører første møte.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Vennskapet med Anita</h2><p>Sonja og Anita ble bestevenner etter innflyttingen i området.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Blå øyne og gul hårspenne</h2><p>Fortellingen utvider først-møte-beskrivelsen med Sonjas blå øyne og store gule hårspenne. Hun har brunt hår og røde sko. Dette supplerer beskrivelsen fra kapittel 8 uten å overføre det historiske antrekket til andre scener.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Lærerstudenten og den første middagen</h2><p>Sonja studerer til lærer og har bøker i fanget da Ove setter seg ved henne på toget. Hun fortalte senere at hun likte de brede skuldrene, muskuløse armene, snille øynene og måten han lyttet på. Etter tre måneder bestemmer hun en restaurantavtale. Hun møter i lang blomstret nederdel og rød kofte.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Lærerstudenten og den første middagen</h2><p>Da Ove innrømmer at han ikke er soldat, blir hun ikke sint. Hun oppmuntrer ønsket hans om å konstruere hus og kommer med kurstilbudet. De planlegger et liv i rekkehus med barn. Ved livets slutt dør hun på sykehuset med hånden i hans, og han blir sittende slik i flere timer.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Faren, bøkene og Ernest</h2><p>Sonjas mor døde i barsel. Faren giftet seg ikke på nytt og bodde i et avsides trehus nordpå. Sonja leste avis som femåring og fikk bibliotekbesøk som del av farens byturer. Hun flyttet til byen for latinlinjen og kalte den store katten Ernest etter Hemingway.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Faren, bøkene og Ernest</h2><p>Som lærer fikk Sonja elever med lese- og skrivevansker til å lese Shakespeare. Hun elsket bøker, faren og katter før Ove kom inn i livet hennes.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>Sorgen og graviditeten</h2><p>Sonja sørger dypt over farens død. Kort etter tar hun avskjed med Ernest hos veterinæren før han dør. På hjemreisen legger hun Oves hånd på magen og foreslår hus for barnet hun venter. Graviditetens lengde fastslås ikke.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Sengen og rådhusbryllupet</h2><p>Sonja spilte musikk for magen og sa at barnet beveget seg til den. Ove og Rune bygde lyseblå sprinkelsenger. Hun og Ove giftet seg i rådhuset med Rune og Anita som eneste gjester.</p></details><details><summary>En mann med navn Ove · 21</summary><h2>Bussferien</h2><p>Sonja foreslår bussreisen og gir penger til tiggere selv om Ove protesterer. På hjemreisen legger hun hånden hans på magen så han kan kjenne barnet sparke.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Rehabiliteringen og lærerjobben</h2><p>Sonja våkner den tiende dagen etter bussulykken. Barnet går tapt, og hun bruker rullestol. Hun ber om rehabilitering, gjenopptar lærerutdanningen etter hjemkomsten og tar eksamen om våren. Hun blir eneste søker til en vanskelig lærerjobb og får elevene til å lese Shakespeare.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Rehabiliteringen og lærerjobben</h2><p>Sonja ber Ove stoppe brevstriden så livet kan få plass hjemme. Neste morgen bygger han rampen hun trenger ved skolen.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Sykdommen mot slutten</h2><p>Fortelleren knytter de sterke smertestillende medisinene Sonja fikk mot slutten til kreftsykdom. Det oppgis ingen krefttype her.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>En tidligere elevs takknemlighet</h2><p>Den unge postmannen sier Sonja var den eneste læreren som ikke så ham som dum. Han forteller at hun fikk ham til å lese Shakespeare, selv om han strevde med lesing og skriving, og at dødsfallet gjorde ham trist.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Rutiner, blomster og elever</h2><p>Sonja og Ove spiste frokost halv sju, før han kjørte henne til skolen. Han hentet henne om ettermiddagen og bar henne opp trappen om kvelden. På lørdagsturene valgte hun sjokoladeis. Hun likte å stelle blomsterbedet sittende på bakken, der evnen til å stå ikke var nødvendig.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Rutiner, blomster og elever</h2><p>Kreftdiagnosen kom fire år før nåtiden. Sonja fortsatte å undervise, men gikk ned til 75, 50 og 25 prosent etter ett, to og tre år. Da hun sluttet, skrev hun til hver elev. Nesten alle ringte, og mange kom på besøk. Hun døde det fjerde året etter diagnosen.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>Bildet fra Spania</h2><p>Sonja ville beholde bildet av seg selv i rød kjole under graviditeten i Spania. Hun beskrev det som et minne like verdifullt som alle andre, selv om Ove ønsket det fjernet.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Kjærlighet som et hjem</h2><p>Sonja sammenlignet det å elske med å flytte inn i et hus. Med tiden blir det kjennskapen til feilene og de små særegenhetene som gjør huset til et hjem.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Utseende ved første møte</h2><p>Ved det første møtet hadde hun brunt hår og blå øyne.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Bøker og interesser</h2><p>Hun elsket bøker, faren og katter allerede før Ove kom inn i livet hennes.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Samtalene</h2><p>Hun pleide å lede samtalene, mens Ove stort sett svarte.</p></details><details><summary>Illustration · En mann med navn Ove · 4</summary><p><a href="assets/fcd558f1560e98.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket i kapittel 4. Inskripsjon og omgivelser er ikke dokumentert.</p></details><details><summary>Illustration · En mann med navn Ove · 8</summary><p><a href="assets/b681385a09037b.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Sonja ved første møte, beskrevet i kapittel 8.</p></details><details><summary>Illustration · En mann med navn Ove · 12</summary><p><a href="assets/8ad7930953ff3c.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Sonja med detaljene fra kapittel 12.</p></details><details><summary>Illustration · En mann med navn Ove · 14</summary><p><a href="assets/1fe3243cba4407.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av det første togmøtet, utfoldet i kapittel 14.</p></details><details><summary>Illustration · En mann med navn Ove · 18</summary><p><a href="assets/5cb56df123cce1.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Sonjas beskjed i kapittel 18.</p></details><details><summary>Illustration · En mann med navn Ove · 21</summary><p><a href="assets/124374bd909c74.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av hjemreisen i kapittel 21.</p></details><details><summary>Illustration · En mann med navn Ove · 23</summary><p><a href="assets/8b4614c3e2aa14.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av samtalen om brevene i kapittel 23.</p></details><details><summary>Illustration · En mann med navn Ove · 30</summary><p><a href="assets/36b9ba6f325de9.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Sonjas hagestell fra tilbakeblikket i kapittel 30.</p></details></noscript>
