      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 6</summary><h2>Introduction</h2><p>Anita er Runes kone og nabo til Ove.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Naboen i samme rekke</h2><p>Anita er Runes kone. De flyttet inn samme dag som Ove og kona hans.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Den kalde boligen og Rune</h2><p>Anita sier at hun er pensjonist og ber Ove om hjelp med radiatorene. Hun forteller at Rune har Alzheimer og sitter i rullestol, og at myndighetene vil flytte ham til et hjem. Hun bestrider Oves «statskupp» og beskriver Rune som valgt styreleder.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Bestevenninnen og hjelpen med varmen</h2><p>Anita og Sonja ble straks bestevenner da familiene flyttet inn. I kapittel 9 kommer Ove for å hjelpe Anita med radiatorene.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Graviditeten og bryllupet</h2><p>Anita var gravid samtidig med Sonja, og Rune og Ove bygde en lyseblå sprinkelseng til hver familie. Anita og Rune deltok ved parets enkle bryllup i rådhuset.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Omsorgen for Rune</h2><p>Anita har grått hår og går i grå bukser og strikkejakke. Hun leder Rune til rullestolen. Ifølge henne mener myndighetene at hun ikke kan ta vare på ham hjemme. Ove husker Sonjas forklaring om hofteoperasjonen og skjelving som «forstadium til MS»; dette er en gjengitt forklaring, ikke en ny diagnose. Sønnen Johan bor ifølge Anita i Amerika.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Beskjeden om inneværende uke</h2><p>Anita sier myndighetene vil hente Rune samme uke, med begrunnelsen at hun ikke kan ta vare på ham alene. Ove hevder at anker vil ta årevis; det er hans vurdering og ingen avklart frist.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Hjelpen hun ikke hadde bedt om</h2><p>Jimmy forteller at Anitas søknad om mer hjemmehjelp førte til utredning og institusjonsvedtak, og at hun har anket i over to år. Ifølge ham ville hun ikke be Ove og Sonja om hjelp fordi de hadde nok problemer. Ove går til henne for å få myndighetspapirene.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Et konkret hentetidspunkt</h2><p>Anita får et rekommandert brev med dato og klokkeslett for henting av Rune, underskrevet av saksbehandleren.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Hun står ikke alene</h2><p>Anita nekter å vike da Rune skal hentes. Ove, Parvaneh, Patrick, Jimmy, Anders, Adrian og Mirsad sier de vil hjelpe. Etter Lenas inngripen går saksbehandleren uten Rune. Anita synes senere hun hører Rune le mens han og Ove snakker alene; kilden tar et forbehold om dette.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Kaffe klokken tre</h2><p>Jimmy kommer hver ettermiddag klokken tre med datteren. Jenta løper mot Anita, og Rune smiler selv om tilstanden hans ikke bedres.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Utseende ved hjemmebesøket</h2><p>Anita har grått hår og er kledd i grå bukser og strikkejakke under besøket.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Innflyttingsdagen</h2><p>Kapittel 6 sier at Anita og Rune flyttet inn samme dag som Ove og kona. Kapittel 20 sier dagen etter. Opplysningene står i motstrid, og den nøyaktige dagen er uavklart.</p></details><details><summary>Illustration · En mann med navn Ove · 9</summary><p><a href="assets/c42a85c71ac5e1.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Oves besøk hos Anita i kapittel 9.</p></details><details><summary>Illustration · En mann med navn Ove · 25</summary><p><a href="assets/0d7e77836d2909.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Anita og Rune i kapittel 25.</p></details><details><summary>Illustration · En mann med navn Ove · 35</summary><p><a href="assets/fe0f78ff6459ce.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av støtten ved døren i kapittel 35.</p></details></noscript>
