      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 17</summary><h2>Den senkede benken og Sonjas ting</h2><p>Kjøkkenet har senket komfyr og benk og hjulspor i gulvet. Ove bygde det om etter en ulykke da kommunen nektet hjelp. Sonjas prydting, hårspenner og håndskrevne lapper er fortsatt her. Ulykkens detaljer er ennå ikke forklart i kapittel 17.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Tilpasningen etter Spaniaulykken</h2><p>Ombyggingen blir forklart i kapittel 23: Etter bussulykken og Sonjas rullestolbruk senker Ove benken, finner en spesialkomfyr og tilpasser døråpninger og terskler. Dette gir ny forklaring til sporene som ble beskrevet i kapittel 17.</p></details><details><summary>Illustration · En mann med navn Ove · 17</summary><p><a href="assets/1009f8292cc004.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av kjøkkenet beskrevet i kapittel 17.</p></details></noscript>
