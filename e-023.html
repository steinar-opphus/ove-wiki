      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 26</summary><h2>Introduction</h2><p>Den unge postmannen har tidligere møtt Ove i en krangel om en sykkel.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>Postmannen og Sonja</h2><p>Ungdommen som tidligere kranglet om sykkelen, viser seg å være postmann. Han forteller Ove at Sonja var læreren som trodde på ham og fikk ham til å lese Shakespeare. Han sier han ble lei seg da hun døde.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>Postmannen og Sonja</h2><p>Sykkelen skal repareres for en jente han håper skal bli kjæresten hans. Han arbeider også på kafé om kveldene og i helgene og sparer til bil; han har sett på en Renault. Ove tilbyr å ta sykkelen ut til ham.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Sykkelreparasjonen på kaféen</h2><p>Postmannen oppgir navnet Adrian. Ove har brakt sykkelen til kaféen og veileder ham gjennom punkteringsreparasjonen på ti minutter. Adrian sier at faren sitter i fengsel. Han ber Ove holde Mirsads legning skjult for faren Amel.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>En Toyota med vinterdekk</h2><p>Adrian har kjøpt Toyota. Ove var med hos bilhandleren og prutet nesten åtte tusen kroner samt vinterdekk med på kjøpet.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Dekkskiftet og Saaben</h2><p>Ove lærer Adrian å skifte dekk. Etter dødsfallet bestemmer brevet hans at Adrian skal ha Saaben.</p></details><details><summary>Illustration · En mann med navn Ove · 26</summary><p><a href="assets/192f4f7cf9519a.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av postmannens besøk i kapittel 26.</p></details></noscript>
