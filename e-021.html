      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 6</summary><h2>Introduction</h2><p>Rune er Anitas mann og nabo til Ove.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Naboen og styrekonflikten</h2><p>Rune og kona Anita flyttet inn i området samme dag som Ove og kona hans. Rune kjørte Volvo før han kjøpte BMW. Ove ser ham som sin fiende og tillegger ham ansvaret for avsettelsen fra styreledervervet.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Anitas opplysninger om sykdommen</h2><p>Anita opplyser at Rune har Alzheimer og sitter i rullestol. Hun forteller at myndighetene vil flytte ham til et hjem. Om styrelederstriden sier hun at han ble valgt til å etterfølge Ove, og bestrider Oves betegnelse «statskupp».</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Alliansen før uvennskapet</h2><p>Rune og Ove var først kamerater og startet styret sammen. Rune var nestleder mens Ove ledet. Sammen stanset de kommunens byggeplaner bak husene. Da Rune senere ble syk, sluttet de mange konfliktene. Ove ser ham nå i rullestol i stuen.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Samarbeidet før barna kom</h2><p>Rune og Ove lånte verktøy og diskuterte priser på gressklippere. Under Anitas og Sonjas graviditeter laget de to lyseblå sprinkelsenger. Rune og Anita var de eneste gjestene ved Ove og Sonjas rådhusbryllup.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Samarbeidet før barna kom</h2><p>Kapittel 20 oppgir at Rune og Anita flyttet inn dagen etter Ove og Sonja. Kapittel 6 oppga samme dag; den nøyaktige innflyttingsrekkefølgen står derfor til vurdering.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Et glimt av gjenkjennelse</h2><p>Rune er avmagret og krokrygget, med grått, nesten hvitt skjegg. Anita leder ham til rullestolen og forteller om myndighetenes krav om hjem. Sønnen Johan bor ifølge henne i Amerika.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Biler som mål på lojalitet</h2><p>I Sonjas forklaring av striden kjørte Rune først Volvo 244, så 245 og 265, deretter ytterligere 265, 745, 740 og 760-modeller. Kjøpet av BMW da Ove så på Saab 9-3, ble særlig viktig for Oves sinne. Sonja kalte ikke bilene hele forklaringen.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Stridenes bakgrunn og slutt</h2><p>Rivaliseringen med Ove vokser fra uteplassene til konflikter om tre, snørydding, gressklipping og vinduer. En kort forsoning med felles middager ender i grillkrangel. Robotklipperen havner senere i bassenget etter at Sonja har sett Ove gå ut med en skrutrekker. Rune kommer på sykehus måneden etter og kjøper ingen ny klipper.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Stridenes bakgrunn og slutt</h2><p>Volvoenes plassbehov følger barnevogn og håp om flere barn, men Anita og Rune får ikke flere. Etter sedanbyttet finner han en halv whiskyflaske ved døren; giveren blir ikke uttrykkelig navngitt. Han forklarer sports-BMW-en med at det bare er Anita og ham igjen. Fortellerens sorgforklaringer er uttrykkelig mulige tolkninger.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Hjelpen til familien ved siden av</h2><p>Etter de truende leieboernes arrestasjon er Rune og Ove forsonet i to måneder. Det anonyme narkotikatipset og posens rolle blir ikke uttrykkelig forklart. Senere griper de sammen inn mot volden i Jimmys hjem. Moren bor hos Rune og Anita i to uker, og økonomisk hjelp lar henne og sønnen bli boende.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Han blir hjemme</h2><p>Anita og naboene motsetter seg hentingen. Etter Lenas og Patricks fremlegg går saksbehandleren og pleierne uten Rune. Ove snakker lenge alene med ham etterpå. Anita synes hun hører latter, men fortelleren tar et forbehold.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Besøkene som får ham til å smile</h2><p>Runes tilstand bedres ikke, og noen dager er han knapt kontaktbar. Når Jimmy og Mirsads datter kommer med Jimmy på de daglige kaffebesøkene, smiler han hver gang.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Utseende under sykdommen</h2><p>Rune beskrives som avmagret og krokrygget, med grått, nesten hvitt skjegg.</p></details><details><summary>Illustration · En mann med navn Ove · 20</summary><p><a href="assets/2252631ead1cb3.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av arbeidet med barnesengene i kapittel 20.</p></details><details><summary>Illustration · En mann med navn Ove · 25</summary><p><a href="assets/0d7e77836d2909.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Anita og Rune i kapittel 25.</p></details><details><summary>Illustration · En mann med navn Ove · 28</summary><p><a href="assets/74f1df4b812190.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av flasken ved Runes dør i kapittel 28.</p></details></noscript>
