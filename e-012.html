      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 3</summary><h2>Utseende og første møte</h2><p>Naboen er blond, storvokst og anslås til nær to meter. Han har strikket kofte i dette møtet.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Utseende og første møte</h2><p>Han presenterer den gravide kvinnen som sin kone. Han sliter med å rygge tilhengeren, som skader Oves grønne postkasse. Ove overtar førerplassen og får tilhengeren på plass. Naboen takker ham for hjelpen.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Navnet og verktøylånet</h2><p>I kapittel 7 presenterer mannen seg som Patrick. Han sier at han er IT-konsulent og låner en stige og sekskantnøkler av Ove. Nøklene skal brukes til en kommode, stigen til et vindu som sitter fast i andre etasje.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Fallet fra stigen</h2><p>Patrick har satt den lånte stigen skjevt i snøen. Senere forteller Parvaneh at han falt da han skulle åpne vinduet, og at ambulansen har kjørt ham til sykehuset. Skadeomfanget er ikke kjent her.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Gipsen etter ulykken</h2><p>Parvaneh forteller at Patrick har gips på én arm og ett ben og må bli på sykehuset i flere dager. Hun omtaler ham som døtrenes far.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Papirene han legger frem</h2><p>Patrick deltar i støtten til Anita. Han sier papirene inneholder saksbehandlerens bankutskrifter, reiseopplysninger, nettleserhistorikk og e-post. Kilden viser ikke innholdet eller hvordan opplysningene er hentet inn. Saksbehandleren forlater stedet uten Rune.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Støtten på hjemveien</h2><p>Patrick og Parvaneh støtter Ove på hjemveien fire dager etter sykehusnatten.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Utseende ved innflyttingen</h2><p>Naboen er storvokst og blond, med en anslått høyde på nær to meter. Ved det første møtet har han strikket kofte.</p></details><details><summary>Illustration · En mann med navn Ove · 3</summary><p><a href="assets/69d0f784e9a172.jpg">Open noncanonical illustration</a></p><p>Portrett av Patrick. Ansikt og øvrige udokumenterte detaljer er kunstnerisk tolkning.</p></details><details><summary>Illustration · En mann med navn Ove · 3</summary><p><a href="assets/3a191e44059dd7.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av ryggingen i kapittel 3. Bilmodell og omgivelser er frie valg.</p></details><details><summary>Illustration · En mann med navn Ove · 7</summary><p><a href="assets/0a347daf234548.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Parvaneh og Patricks besøk med kaker i kapittel 7.</p></details></noscript>
