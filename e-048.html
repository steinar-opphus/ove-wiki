      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 29</summary><h2>Introduction</h2><p>Amel presenteres som eieren av kaféen.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Varmeviften og gjestene</h2><p>Ove reparerer varmeviften etter å ha krevd at katten får bli. Ifølge Adrian kjenner Amel ikke sønnens legning.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>Sønnens forklaring om utkastelsen</h2><p>Mirsad sier han har fortalt Amel at han er homofil, og at faren deretter kalte ham syk og nektet ham å bo hjemme. Dette blir fortalt gjennom sønnen, ikke vist som en egen scene.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>To glass på disken</h2><p>Fortelleren bekrefter nå at Amel kastet Mirsad ut. Ove besøker ham og ber om den tidligere tilbudte whiskyen. Amel henter en flaske og to glass; den videre samtalen blir ikke vist i dette kapitlet.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Samtalen med sønnen</h2><p>Amel oppsøker Mirsad hos Ove. De snakker på kjøkkenet om skuffelser, håp, mannlighet og mot, mens Ove spiser hos Parvaneh.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Bryllupsfesten på kaféen</h2><p>Bryllupsfesten for Mirsad og Jimmy holdes på Amels kafé. Han forsøker å holde tale og oppkaller et smørbrød etter Jimmy.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Utseende ved første møte</h2><p>Amel er kort og firskåren og har flekkete skjorte i dette møtet.</p></details><details><summary>Illustration · En mann med navn Ove · 29</summary><p><a href="assets/8c5a0dd6283b4f.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av varmeviftereparasjonen i kapittel 29.</p></details><details><summary>Illustration · En mann med navn Ove · 36</summary><p><a href="assets/0d2fafa5338b00.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av møtet på kaféen i kapittel 36.</p></details></noscript>
