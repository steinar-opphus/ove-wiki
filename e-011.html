      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 3</summary><h2>Den nye naboen</h2><p>Kvinnen er kortvokst, svarthåret og anslås til trettiårene. Hun er gravid ved det første møtet. Øynene er brune og virker usedvanlig store for Ove.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Den nye naboen</h2><p>Den blonde mannen presenterer henne som kona si. Hun gestikulerer under mannens ryggeforsøk og takker Ove etter at han får tilhengeren på plass. Senere står hun smilende i døren når Nasanin og den eldste jenta kommer tilbake etter å ha levert mat til ham.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Navnet og besøket med kaker</h2><p>I kapittel 7 presenterer kvinnen seg som Parvaneh og sier at hun er fra Iran; hun retter Oves «arabiske» til «persiske» kaker. Hun har foreldrepermisjon, og graviditeten omtales som parets tredje barn.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Uten førerkort</h2><p>Parvaneh oppgir at hun er tretti og ikke har førerkort. Etter Patricks fall kommer hun til Ove for å få skyss til sykehuset med barna. Porten treffer henne i ansiktet og gir neseblod.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Katten og unnskyldningen på kjøkkenet</h2><p>Parvaneh løfter katten opp fra snøen og får den inn til Ove. Hun sier at navnet hennes betyr sommerfugl. På det ombygde kjøkkenet ber hun om unnskyldning for å ha gått inn uten å spørre. Hun sier at jentene er allergiske og ikke kan ha katten, men Ove er mistenksom overfor pausen i svaret hennes.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Avtalen om Lena og skyssen</h2><p>Parvaneh oppdager at Lena er låst inne i garasjen. Hun avtaler sykehusskyss med Ove mot hjelp til å bli kvitt journalisten, slipper Lena ut og gir henne kortet sitt.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Et ønske om kjøretimer</h2><p>Parvaneh forteller at hun er eiendomsmegler og aldri har hatt førerkort. Fordi Patrick ifølge henne blir gipset i flere måneder, ber hun Ove øvelseskjøre med henne.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>Ove sier ja til øvelseskjøring</h2><p>Ove avtaler å hente Parvaneh om to timer; de skal bruke hans bil til øvelseskjøring.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Den første kjøretimen</h2><p>Parvaneh ønsket å lære automatgir; Ove insisterer på manuell giring. Ved et trafikklys ruller bilen bakover i en SUV. Etter en vanskelig start og Oves oppmuntring lærer hun å kjøre samme ettermiddag. Når Ove sier hun «sikkert» har flyktet fra krig og forfølgelse, er det hans antakelse.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Et tilbud som blir avvist</h2><p>Parvaneh tilbyr å hjelpe Ove med å pakke bort Sonjas ting. Han avviser forslaget sint.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>Hun kommer gjennom snøen</h2><p>Parvaneh og Ove avtaler øvelseskjøring neste morgen klokken åtte. Senere hører Ove henne komme gjennom snøen etter at han har falt med brystsmerter og pustevansker.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Pårørende, minner og fødsel</h2><p>Parvaneh er registrert som Oves nærmeste pårørende. Hun sier hennes egen far døde i Iran. Etter Oves hjemkomst hjelper hun og jentene ham å pakke Sonjas ting; han godtar at jentene kaller ham morfar. Samme kveld drar hun til sykehuset og føder en gutt.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Førerkortet og årene etterpå</h2><p>Parvaneh består førerprøven om våren og kjøper senere ny gressklipper til fellesplenen. Nesten fire år etter innflyttingen blir hun urolig når Ove ikke har måkt. Hun finner ham død og tar vare på brevet han har skrevet til henne. Hun beslutter at pengene han har etterlatt skal gå til Sonjas fond for foreldreløse barn, og viser senere huset til et ungt par.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Utseende ved innflyttingen</h2><p>Naboen er kortvokst og svarthåret, med brune øyne som Ove opplever som svært store.</p></details><details><summary>Illustration · En mann med navn Ove · 3</summary><p><a href="assets/5027dffea614ea.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av naboen ved første møte i kapittel 3. Antrekk og ansiktstrekk er frie valg.</p></details><details><summary>Illustration · En mann med navn Ove · 7</summary><p><a href="assets/0a347daf234548.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Parvaneh og Patricks besøk med kaker i kapittel 7.</p></details><details><summary>Illustration · En mann med navn Ove · 11</summary><p><a href="assets/1ea772aa795ee6.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av forespørselen om sykehusskyss i kapittel 11.</p></details><details><summary>Illustration · En mann med navn Ove · 17</summary><p><a href="assets/fff6710cc8ebcb.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av katten som blir tatt inn i kapittel 17.</p></details><details><summary>Illustration · En mann med navn Ove · 22</summary><p><a href="assets/9fb1541a44541d.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av løsningen ved garasjen i kapittel 22.</p></details><details><summary>Illustration · En mann med navn Ove · 27</summary><p><a href="assets/929eb483064055.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av kjøretimen i kapittel 27.</p></details><details><summary>Illustration · En mann med navn Ove · 39</summary><p><a href="assets/b939600bd94822.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av den varsomme pakkingen i kapittel 39.</p></details></noscript>
