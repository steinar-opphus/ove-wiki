      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 1</summary><h2>Introduction</h2><p>Ove er 59 år gammel og kjører Saab.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>En krevende kunde</h2><p>I butikkmøtet opptrer Ove konfronterende: fortelleren beskriver at han lener seg truende over disken, og han presser pekefingeren demonstrativt ned i den.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Datamaskinen og tastaturet</h2><p>Ove vifter med en mellomstor hvit eske ved butikkdisken og sier at han vil ha en vanlig datamaskin. Han spør hvor tastaturet kan foldes ut. Når ekspeditøren forklarer at produktet styres direkte på skjermen, insisterer Ove på at han må ha et tastatur. Ekspeditøren anbefaler en MacBook i stedet.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Ventingen ved disken</h2><p>Ove ser på armbåndsuret og sier at han har andre ting å gjøre enn å vente hele dagen. En kollega av ekspeditøren kommer til og foreslår avdelingen for bærbare datamaskiner.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Hjemmet og morgenrunden</h2><p>Ove og kona har bodd i rekkehusområdet i nesten fire tiår. Huset er nedbetalt. Han pleier å stå opp klokken 05.45 uten vekkerklokke og går en inspeksjonsrunde hver morgen. Han noterer registreringsnumre på gjesteparkeringen og kontrollerer søppelsorteringen på eget initiativ. Denne morgenen skiller han glass fra metall og setter en feilparkert sykkel inn i boden.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>En katt på gangveien</h2><p>Tre uker før butikkmøtet møter Ove katten under morgenrunden, iført blå bukser, blå jakke og tresko. Fortelleren beskriver umiddelbar, gjensidig motvilje. Ove går trampende mot katten og vurderer å kaste en tresko, men noen slik kasting beskrives ikke. Han jager katten, som går sin vei.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Striden om kameraene</h2><p>Ove har vært leder i bostadsrättsföreningen i rekkehusområdet. Han foreslo kameraovervåking av søppelrommene og ble nedstemt. Da han senere var avsatt, kalte han det «statskuppen». Han motsatte seg også et nytt forslag om internettbasert overvåking, og det ble ikke satt opp kameraer.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Naboer sett fra vinduet</h2><p>Ove ser en joggende nabo som han mener heter Anders. Han har også oppfattet at en barnefamilie nylig har flyttet inn rett overfor.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Beskjeden fra jobben</h2><p>Mandagen før tirsdagsscenen fikk Ove beskjed om «arbetsbrist» og at arbeidsplassen skulle fase ut den eldre generasjonen. Han hadde vært der i en tredjedel av et århundre. Tankene hans uttrykker en opplevelse av ikke lenger å ha noen funksjon.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kroken og avbrytelsen</h2><p>Hjemme sier Ove opp telefon- og avisabonnementene og gjør vedlikeholdsarbeid. Han planlegger å feste en særlig solid krok sentrert i stuetaket; formålet er ikke oppgitt. En lang skrapelyd avbryter ham.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Oppveksten ved jernbanen</h2><p>Som barn gledet Ove seg til matematikktimene. Moren døde da han var sju. Faren lærte ham bilmekanikk, og som åtteåring bestemte han seg for å holde seg til Saab.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Oppveksten ved jernbanen</h2><p>Da niåringen fant en lommebok med over seks tusen kroner, stilte faren seg mellom ham og Tom. Ove valgte å levere pengene på hittegodskontoret. Faren døde senere etter å ha blitt rammet av en løpsk jernbanevogn. Ove stod igjen med bil, hus og armbåndsur.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Oppveksten ved jernbanen</h2><p>Ove ville betale tilbake den delen av farens lønn som ikke var opptjent. Direktøren tilbød ham i stedet å jobbe for pengene. Han vendte aldri tilbake til skolen og arbeidet fem år ved jernbanen. På et tog fikk han se sin framtidige kone første gang og lo for første gang siden farens død.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Anklagen og nattarbeidet</h2><p>Ove lå to årstrinn foran i matematikk, men likte det praktiske arbeidet ved jernbanen og fikk fortsette etter de første ukene. En gang reparerte han arbeidslagets lastebil i regnvær med få hjelpemidler.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Anklagen og nattarbeidet</h2><p>Som 18-åring blir Ove falskt anklaget etter at Tom har stjålet fra billettkassen. Han nekter å angi Tom. Direktøren lar ham signere frivillig oppsigelse, men gir ham en ny jobb som nattvasker, med henvisning til lommeboken Ove leverte som niåring. Ove har denne jobben i to år.</p></details><details><summary>En mann med navn Ove · 10</summary><h2>Barndomshjemmet han bygde opp</h2><p>Etter myndighetsdagen selger Ove farens Saab 92 og kjøper en blå Saab 93. Han motsetter seg salg av barndomshjemmet og tar ekstraarbeid på byggeplass for å lære å renovere. Kollegene hjelper med materialer, kunnskap og verktøy, og arbeidet gjør ham muskuløs. Til slutt står huset ferdig.</p></details><details><summary>En mann med navn Ove · 10</summary><h2>Barndomshjemmet han bygde opp</h2><p>En mann oppsøker Ove, vinner tilliten hans gjennom husprat og tar kontant betaling for en påstått husforsikring. Senere går Ove inn i naboens brennende hus og rydder vei for mannen som redder barnebarnet. Brannen tar deretter Oves eget hus; selskapet finner ingen forsikring.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Etter brannen og den tapte militærframtiden</h2><p>Etter brannen sover Ove i bilen og blir presset til å selge tomten. Han leier et lite rom i byen. Da han finner farens bortkomne ur i Toms jakke, slår han Tom én gang. Dette blir siste gang de møtes.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Etter brannen og den tapte militærframtiden</h2><p>Ove forlater byggeplassjobben med nye verktøy som gave, og vertinnen finner reparasjoner som holder ham opptatt. Han gjør det svært godt på sesjonens fysiske tester og ønsker en militær framtid, men undersøkelsene avdekker et sjeldent medfødt hjerteproblem. Han fritas og fortsetter med tog og Saab-er.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Tre måneder på toget og veien til byggekontoret</h2><p>Ove velger toget med Sonja etter nattskiftet, låner klær og setter seg ved henne. Han sier feilaktig at han er soldat og fortsetter reisene i tre måneder. På restaurantkvelden forteller han sannheten, og Sonja viser at hun alt hadde forstått den.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Tre måneder på toget og veien til byggekontoret</h2><p>Da Ove sier at han vil konstruere hus, finner Sonja et korrespondansekurs. Han fullfører det planlagt toårige kurset på seks måneder, tar flere kurs og får jobben på byggekontoret som han beholder i mer enn en tredjedel av et århundre. De kjøper rekkehus med tanke på familie, og Ove frir når Sonja ønsker å gifte seg.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Armbåndsuret og besøket ved graven</h2><p>Ove arvet det gamle armbåndsuret etter faren, som døde få dager etter at Ove fylte 16. Faren hadde selv fått det fra sin far som 19-åring.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Armbåndsuret og besøket ved graven</h2><p>Ved besøket i kapittel 4 har Ove blå dress, hvit skjorte kneppet helt opp og svarte pussete pensko. Han planter to rosa blomster, stryker over den store steinen og hvisker at han savner kona. Hun døde seks måneder før denne scenen. Ove kontrollerer fortsatt varmeovnene som om hun kunne ha skrudd dem opp.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Besøket hos Sonjas far</h2><p>I tilbakeblikket beskrives unge Ove med blå øyne. Sonja fikk etter hvert vite om brannarrene hans og så redningen som et uttrykk for hvem han var. Ved første besøk hos faren hennes er middagen taus til lastebilen blir tema. Ove tilbyr hjelp og går ut for å se på motoren.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>To avskjeder og en framtidsplan</h2><p>Ove reparerte taket og lastebilen hos Sonjas far. Etter farens død holder han seg opptatt med vedskjul og arbeid ute mens Sonja sørger. Han kjører Ernest til veterinæren etter påkjørselen, men katten dør.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>To avskjeder og en framtidsplan</h2><p>Da Sonja legger hånden hans på magen og foreslår eget hus med tanke på barn, svarer Ove at de trenger stasjonsvogn.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Barnesengene, vielsen og journalistbesøket</h2><p>Under de parallelle graviditetene visste Ove lite om å bli far. Sammen med Rune bygde han to lyseblå sprinkelsenger. Da han og Sonja giftet seg i rådhuset, var bare Rune og Anita til stede.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Barnesengene, vielsen og journalistbesøket</h2><p>Lena oppsøker Ove for et intervju om redningen. Han konfronterer Skoda-føreren, som kjenner navnet hans og sier at saken om Rune bestemmes av utredningen fremfor Anita. Dette vekker Oves minner om hjemkomsten fra Spania etter ulykken.</p></details><details><summary>En mann med navn Ove · 21</summary><h2>Hjelpen i Spania og sparket i bussen</h2><p>Under bussferien i Spania hjelper Ove José ved en bil med en syk passasjer. Han hjelper også med gjerde, kirkevegg og en hest i en grøft. José serverer paret gratis resten av uken. På bussen hjem kjenner Ove barnet sparke for første gang.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Ulykken og rampen</h2><p>På hjemreisen kolliderer bussen etter at Ove har reist seg. Han hadde merket vinlukt fra sjåføren. Sonja våkner den tiende dagen, men barnet de ventet er tapt. Ove bygger om kjøkkenet, døråpninger og terskler for hjemkomsten.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Ulykken og rampen</h2><p>Ove skriver klager og anker i måneder. Da Sonja ber ham stanse, bygger han selv rampen ved skolen hennes neste morgen.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Savnet etter det vanlige</h2><p>Ove savner rutinene med Sonja: frokost halv sju, kjøring til skolen, middag og å bære henne opp til soverommet. Favorittmaten er kjøtt, poteter og saus; på lørdagsturene valgte han nøtteis. Han avviser sint Parvanehs tilbud om å pakke bort Sonjas ting.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Savnet etter det vanlige</h2><p>En rød Saab midt i 1980-årene ble etter tre år erstattet av blå igjen. Hans nåværende blå Saab 9-5 stasjonsvogn ble kjøpt tretten år før nåtiden. Ved graven gir han uttrykk for en ny selvmordsplan.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Dødsønsket og forsvaret av katten</h2><p>I kapittel 6 blir Oves selvmordstanker uttrykkelige. Han har ordnet gravplass ved kona og samlet viktige papirer og instrukser. Etter hennes død gikk han på jobb mandagen etter gravferden.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Dødsønsket og forsvaret av katten</h2><p>Ove flytter en punktert sykkel inn i boden og havner i ordskifte med en ungdom. Senere oppdager han at Anders’ kjæreste kaster steiner på katten. Han stopper henne med en trussel. Hunden Prince prøver å bite ham, men trekker seg når han tramper ned. Katten blir sittende en stund før den går.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Avbruddene ved døren</h2><p>Krokens formål blir klart i kapittel 7: Ove planlegger selvmord. Naboene avbryter ham med kaker. De presenterer seg som Parvaneh og Patrick, og han låner bort stige og nøkler. Anita kommer også for å be om hjelp med varmen.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Avbruddene ved døren</h2><p>Anita nevner Sonja og begynner å forklare spor i gulvet, men Ove avbryter henne rasende. Etterpå får han hjertebank og tung pust. Arbeidsgiverne hadde omtalt avslutningen som førtidspensjonering og vist til hjerteproblemer. Han ser på et gammelt Spania-fotografi og lengter etter igjen å holde Sonjas hånd. Kapittelet ender med et selvmordsforsøk uten kjent utfall.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Den gamle alliansen og besøket hos Anita</h2><p>Ove og Rune startet styret sammen, med Rune som nestleder. De kjempet i halvannet år mot bygging i skogen bak husene og feiret utfallet på Runes terrasse. Etter at Rune ble syk, tok de langvarige konfliktene slutt, og en del av Ove savner ham.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Den gamle alliansen og besøket hos Anita</h2><p>I kapittel 9 blir utfallet av selvmordsforsøket kjent: tauet ryker, og Ove overlever. Han rydder bort forberedelsene og drar deretter til Anita for å hjelpe med radiatorene.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Snømorgenen og turen til sykehuset</h2><p>Etter snøfallet måker Ove omhyggelig og blir provosert av en hvit Skoda som kjører i området. Anita sier at føreren er fra kommunen. Ove merker også at han ser etter katten når den blir borte fra syne.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Snømorgenen og turen til sykehuset</h2><p>Et nytt selvmordsforsøk avbrytes av Parvaneh. Hun ber om skyss etter at Patrick har falt fra stigen og er kjørt til sykehuset. Ove skader nesen hennes ved et uhell med porten og gjør seg deretter klar til å kjøre familien.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Barnevakten og sykehusklovnen</h2><p>På sykehuset lar Parvaneh Ove passe Nasanin og storesøsteren. Han leser en bildebok, mens den eldste ber om eventyrstemmer. Klovnen Beppo låner en femkrone til et triks. Nasanin sier etterpå at Ove slo ham; Ove nedtoner dette og sier at klovnen forsøkte å levere en annen femkrone tilbake. Vaktene holder Ove tilbake.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Barnevakten og sykehusklovnen</h2><p>Hjemme ber Parvaneh om hjelp med stigen og en radiator, og Ove henter verktøy i stedet for å fortsette planene sine.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Redningen på stasjonen og funnet i snøen</h2><p>På stasjonen oppdager Ove at en mann besvimer og faller på sporet. Han får ham opp med hjelp fra ungdommer. Han blir stående med dødsønsket sitt, men ser den unge lokføreren og kommer seg opp på perrongen; han vil ikke ødelegge førerens liv.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Redningen på stasjonen og funnet i snøen</h2><p>Hjemme møter han kommunebilen igjen og blir hånet av Anders’ kjæreste om framtidig plassering på hjem. Han får tung pust og må støtte seg på knærne. Ved boden finner han katten i bunnen av et hull i snøen.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Katten på sofaen og kjøkkenets spor</h2><p>Parvaneh tar katten inn, og Ove henter teppet. Jimmy hjelper med oppvarmingen. Ove kjenner lettelse når katten blir varmere og minner om Ernest dukker opp.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Katten på sofaen og kjøkkenets spor</h2><p>Ove har selv senket kjøkkenbenken og komfyren etter en ulykke, fordi kommunen nektet å hjelpe. Parvaneh beklager at hun gikk inn uten å spørre og legger hånden på skulderen hans. Etter Jimmys allergiske reaksjon kjører Ove dem til sykehuset uten å protestere mot at hun betaler parkeringen.</p></details><details><summary>En mann med navn Ove · 19</summary><h2>Sokker, tunfisk og en ny beboer</h2><p>Etter veterinærens undersøkelse gir Ove katten stell og mat. Han tar små sokker på potene og har for første gang følge på inspeksjonsrunden. Han tar den også med på ærend og til Sonjas grav. Der sier han at katten nå bor hos dem, og den legger hodet i håndflaten hans.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Ryggingen og maten fra naboene</h2><p>Naboens tilhenger skraper langs Oves hus og havner i bedet. Et nytt ryggeforsøk bøyer den grønne postkassen hans dobbelt. Ove overtar rattet og rygger tilhengeren på plass mellom husene.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Ryggingen og maten fra naboene</h2><p>Den gravide naboen og mannen hennes takker ham. Senere kommer Nasanin og en eldre jente med ris, safran og kylling; den eldste sier at moren syntes han så sulten ut. Ove setter maten kaldt og spiser den om kvelden.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Ryggingen og maten fra naboene</h2><p>Hjemme opplever Ove økende konsentrasjonsvansker. Oppsettingen av kroken blir utsatt til neste dag.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Lena i garasjen</h2><p>Ove vil slippe Lenas intervju og låser henne inne i garasjen. Han sier at hensikten var å stenge seg selv og katten unna henne. Parvaneh ordner opp mot at Ove kjører til sykehuset. Hun gir Lena visittkortet sitt, og Ove blir sittende utenfor sykehuset med katten.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Lena i garasjen</h2><p>Ove mener Parvaneh har løyet om Nasanins allergi for å få ham til å beholde katten. Dette er hans konklusjon, ikke en uavhengig avklaring.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Tegningen og de andre husene</h2><p>Ove nekter å sende katten til et kattehjem. Parvaneh gir ham Nasanins tegning, der han er tegnet i farger og resten i svart. Hun sier han er den morsomste jenta vet. Hjemme i garasjen ser han på katten og slår av motoren. Neste morgen måker han også foran naboenes hus.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Et tilbud til Anita</h2><p>Ove avbryter en ny selvmordsplan når katten blir angrepet. Han gir den vann. Hos Anita og Rune låner han bølgeblikk; Anita forteller om presset for å flytte Rune på hjem. Ove tilbyr hjelp med radiatorene. Han lager så en hundefelle, men fjerner den før den tas i bruk.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>En elev ved døren</h2><p>Den unge postmannen forteller at Sonja trodde på ham som elev og fikk ham til å lese Shakespeare. Ove tilbyr å gi ham sykkelen tilbake. Deretter avtaler han å hente Parvaneh til øvelseskjøring i sin bil.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Oppmuntring ved rattet</h2><p>Sonja forklarte rivaliseringen med Rune gjennom bilbyttene deres, fra Saab 96 og Volvo 244 til Oves interesse for Saab 9-3 og Runes kjøp av BMW. Hun sa også at dette ikke nødvendigvis var hele grunnen.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Oppmuntring ved rattet</h2><p>Under Parvanehs første kjøretime presser Ove en tutende SUV-fører mot bilen hans. Tilbake i Saaben oppmuntrer han Parvaneh: Hun er ikke en komplett idiot. Hun lærer å kjøre den ettermiddagen. Hans utsagn om at hun «sikkert» har flyktet fra krig, er en antakelse, ikke bekreftet bakgrunn.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Årene med nabostrid</h2><p>Konkurransen med Rune omfatter uteplasser, gjerder, rottegift, trær, snørydding, gressklipping, vinduer og grilling. Ove stanser Runes vindusbytte, men bytter selv året etter. Påstanden hans om at gressklippingen ble overtatt ved løgn og konspirasjon, er ikke bevist.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Årene med nabostrid</h2><p>Sonja ser Ove gå ut med en skrutrekker før robotklipperen havner i bassenget; selve handlingen vises ikke. Bilene får også en praktisk forklaring: Saab 95 rommer Sonjas rullestol, og senere Saab 900 den sammenleggbare stolen. Fortellerens tanker om sorg som årsak til bruddet er mulige forklaringer, ikke sikre psykologiske fakta.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Reparasjoner på kaféen</h2><p>Besøket på kaféen er Oves første siden Sonja døde; før gikk de hver søndag. Han har fraktet sykkelen til Adrian og hjelper ham å reparere punkteringen. Deretter reparerer han Amels varmevifte på vilkår av at katten får bli. Han blir også kjent med Mirsad.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Tilhengeren og utmattelsen</h2><p>Parvaneh avbryter en ny selvmordsplan med en telefon fra Lena. Mannen i den hvite skjorten sier han kjenner brevstriden om Sonja og hentyder til Oves hjerte.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Tilhengeren og utmattelsen</h2><p>Etter at Ove ber Patrick låne en tilhenger igjen, blir Skodaen sperret inne. Selve parkeringen vises ikke. Anita sier Rune skal hentes samme uke. Ove hevder anker vil ta årevis, men dette er hans vurdering. Han stenger døren og får skjelving, hjertebank og langvarig brysttrykk.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>Plass til en til</h2><p>Adrian og Mirsad avbryter Oves selvmordsforberedelser. Ove møter dem med gevær og skremmer Adrian. Mirsad forteller at faren har kastet ham ut fordi han er homofil. Til tross for Oves første protest blir Mirsad boende.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Da tidsfristen blir virkelig</h2><p>På inspeksjonsrunden går Mirsad, Jimmy og katten sammen med Ove. Han stanser Jimmys spørsmål om Mirsads private konflikt. Jimmy forklarer at Anitas søknad om mer hjemmehjelp endte med institusjonsvedtak, og at hun allerede har anket i over to år. Hun ville ifølge Jimmy skåne Ove og Sonja. Ove erkjenner at han trodde prosessen nettopp hadde begynt, og går til Anita for å hente papirene.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Naboene stiller opp igjen</h2><p>Tidligere hadde Ove og Rune grepet inn mot volden i Jimmys barndomshjem og hjulpet moren økonomisk. Den nye gjennomgangen bekrefter også at Ove bevisst hadde blokkert Skodaen.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Naboene stiller opp igjen</h2><p>Anders eier et bilbergingsfirma, og en av hans bergere flytter Skodaen til et grustak fire mil utenfor byen. Anita mottar deretter et brev med tidspunkt for henting av Rune. Ved Sonjas grav sier Ove at han ikke har tid til å dø nå.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Gaven og naboenes motstand</h2><p>Ove har restaurert den lyseblå barnesengen til Parvaneh. Han sier den også kan males rosa, uansett barnets kjønn.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Gaven og naboenes motstand</h2><p>Da saksbehandleren kommer for å hente Rune, stiller Ove og naboene seg bak Anita. Lena legger frem sin granskning, og Patrick oppgir å ha innhentet personopplysninger. Mannen og pleierne går uten Rune. Etterpå snakker Ove lenge alene med Rune.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Historier, hus og et besøk</h2><p>Etter middagen hos Parvaneh leser Ove for Nasanin. Han blir også sittende i to og en halv time med storesøsteren og hennes husbyggerspill. Hun viser ham en tegning av huset hans.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Historier, hus og et besøk</h2><p>Ove oppsøker Amel og ber om whiskyen han tidligere ble tilbudt. Amel henter en flaske og to glass. Samtalens videre innhold er ikke vist her.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Bildet på kjøleskapet</h2><p>Ove har gjennomført intervjuet med Lena og havner på forsiden. Han leser brevet som er sendt videre fra mannen han reddet. Det vedlagte bildet henger han på kjøleskapet ved Nasanins tegning.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Bildet på kjøleskapet</h2><p>Parvaneh, jentene og flere naboer blir med til Sonjas grav. Etterpå lar Ove Amel og Mirsad snakke alene på kjøkkenet mens han spiser hos Parvaneh. Storesøsteren inviterer ham i bursdag og forteller at hun ønsker seg en iPad til tegning.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>En gave og et nytt familienavn</h2><p>Med hjelp fra Jimmy kjøper Ove en iPad til 7 995 kroner til jentas åtteårsdag. Hun klemmer ham og takker med «morfar». Dette er hennes valgte familienavn på ham, ikke en opplysning om biologisk slektskap. Ove avtaler mer øvelseskjøring med Parvaneh neste morgen.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>En gave og et nytt familienavn</h2><p>Under kveldsrunden ser Ove tre skikkelser ved et mørkt nabohus og oppfatter et innbrudd. På vei mot dem får han sterke brystsmerter og pustevansker og faller i snøen. Tyvene flykter. Han hører Parvaneh komme før han mister bevisstheten. Utfallet er ikke kjent ved dette kapitlets slutt.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Hjem igjen og plass til minnene</h2><p>Ove overlever kollapsen. Parvaneh er registrert som nærmeste pårørende. Legen sier han har en hjertefeil og forklarer den med at hjertet er for stort. Ifølge legen kan medisiner holde tilstanden under kontroll, men tidsperspektivet er usikkert.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Hjem igjen og plass til minnene</h2><p>Fire dager senere kommer Ove hjem med støtte fra Parvaneh og Patrick. Han godtar morfar-navnet og setter jentenes tegninger på kjøleskapet. Parvaneh og jentene hjelper ham så å pakke Sonjas ting. Senere går turen til sykehuset igjen, og Parvaneh føder en gutt.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Årene som fulgte</h2><p>Ove lærer Adrian dekkskift, viser stolt papirbilder av Parvanehs sønn og blir Jimmys forlover da han gifter seg med Mirsad. Han hjelper stadig flere naboer med reparasjoner. Nasanin følges til første skoledag og lærer ham smilefjes i SMS. Han bygger et lite basseng til lillebroren.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Dødsfallet og det han etterlot</h2><p>Nesten fire år etter familiens innflytting finner Parvaneh Ove død i sengen en novembermorgen, med katten ved siden av. Ingen dødsårsak oppgis. Brevet hans bestemmer at Adrian skal ha Saaben. Det oppgir over elleve millioner etter Sonjas far, med én million til hvert av de fire barna ved atten år og resten til Parvaneh.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Dødsfallet og det han etterlot</h2><p>Mer enn tre hundre kommer i begravelsen. Parvaneh lar pengene gå til Sonjas fond for foreldreløse barn. Senere viser hun huset til et ungt par; mannen kjører Saab.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Utseende</h2><p>Ove beskrives som muskuløs og robust.</p></details><details><summary>Illustration · En mann med navn Ove · 1</summary><p><a href="assets/45ac81b1defc7b.jpg">Open noncanonical illustration</a></p><p>Ove ved butikkdisken i kapittel 1. Ansikter, klær og interiør er kunstneriske valg.</p></details><details><summary>Illustration · En mann med navn Ove · 2</summary><p><a href="assets/008e386cdeff13.jpg">Open noncanonical illustration</a></p><p>Ove og katten på gangveien i kapittel 2. Ansikter, lys og husenes utforming er kunstneriske valg.</p></details><details><summary>Illustration · En mann med navn Ove · 3</summary><p><a href="assets/3a191e44059dd7.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av ryggingen i kapittel 3. Bilmodell og omgivelser er frie valg.</p></details><details><summary>Illustration · En mann med navn Ove · 4</summary><p><a href="assets/fcd558f1560e98.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket i kapittel 4. Inskripsjon og omgivelser er ikke dokumentert.</p></details><details><summary>Illustration · En mann med navn Ove · 1</summary><p><a href="assets/313e734fdab1d7.jpg">Open noncanonical illustration</a></p><p>Portrett av Ove. Ansikt og øvrige udokumenterte detaljer er kunstnerisk tolkning.</p></details><details><summary>Illustration · En mann med navn Ove · 5</summary><p><a href="assets/f291221a446032.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av innleveringen på hittegodskontoret i kapittel 5.</p></details><details><summary>Illustration · En mann med navn Ove · 6</summary><p><a href="assets/971e84a9f26899.jpg">Open noncanonical illustration</a></p><p>Skånsom kunstnerisk tolkning av Oves inngripen i kapittel 6.</p></details><details><summary>Illustration · En mann med navn Ove · 7</summary><p><a href="assets/0a347daf234548.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Parvaneh og Patricks besøk med kaker i kapittel 7.</p></details><details><summary>Illustration · En mann med navn Ove · 8</summary><p><a href="assets/9e2fb84610c5c3.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av jobbtilbudet i kapittel 8.</p></details><details><summary>Illustration · En mann med navn Ove · 9</summary><p><a href="assets/c42a85c71ac5e1.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Oves besøk hos Anita i kapittel 9.</p></details><details><summary>Illustration · En mann med navn Ove · 10</summary><p><a href="assets/a3f936f8c8232b.jpg">Open noncanonical illustration</a></p><p>Skånsom kunstnerisk tolkning av øyeblikket etter redningen i kapittel 10.</p></details><details><summary>Illustration · En mann med navn Ove · 10</summary><p><a href="assets/d4af44cee69916.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av unge Ove i tilbakeblikket i kapittel 10.</p></details><details><summary>Illustration · En mann med navn Ove · 11</summary><p><a href="assets/1ea772aa795ee6.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av forespørselen om sykehusskyss i kapittel 11.</p></details><details><summary>Illustration · En mann med navn Ove · 12</summary><p><a href="assets/8a42968f0845e5.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av avskjedsgaven i kapittel 12.</p></details><details><summary>Illustration · En mann med navn Ove · 13</summary><p><a href="assets/54d4ba46f15896.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av lesestunden på sykehuset i kapittel 13.</p></details><details><summary>Illustration · En mann med navn Ove · 14</summary><p><a href="assets/1fe3243cba4407.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av det første togmøtet, utfoldet i kapittel 14.</p></details><details><summary>Illustration · En mann med navn Ove · 15</summary><p><a href="assets/0a118547b80a42.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av funnet i snøfonnen ved slutten av kapittel 15.</p></details><details><summary>Illustration · En mann med navn Ove · 16</summary><p><a href="assets/422d18514e4922.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket hos Sonjas far i kapittel 16.</p></details><details><summary>Illustration · En mann med navn Ove · 17</summary><p><a href="assets/fff6710cc8ebcb.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av katten som blir tatt inn i kapittel 17.</p></details><details><summary>Illustration · En mann med navn Ove · 18</summary><p><a href="assets/5cb56df123cce1.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Sonjas beskjed i kapittel 18.</p></details><details><summary>Illustration · En mann med navn Ove · 19</summary><p><a href="assets/c4855707e6894f.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket med katten i kapittel 19.</p></details><details><summary>Illustration · En mann med navn Ove · 20</summary><p><a href="assets/2252631ead1cb3.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av arbeidet med barnesengene i kapittel 20.</p></details><details><summary>Illustration · En mann med navn Ove · 21</summary><p><a href="assets/124374bd909c74.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av hjemreisen i kapittel 21.</p></details><details><summary>Illustration · En mann med navn Ove · 22</summary><p><a href="assets/9fb1541a44541d.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av løsningen ved garasjen i kapittel 22.</p></details><details><summary>Illustration · En mann med navn Ove · 23</summary><p><a href="assets/8b4614c3e2aa14.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av samtalen om brevene i kapittel 23.</p></details><details><summary>Illustration · En mann med navn Ove · 24</summary><p><a href="assets/383eec6cf6a409.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av snømåkingen foran naboenes hus i kapittel 24.</p></details><details><summary>Illustration · En mann med navn Ove · 26</summary><p><a href="assets/192f4f7cf9519a.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av postmannens besøk i kapittel 26.</p></details><details><summary>Illustration · En mann med navn Ove · 27</summary><p><a href="assets/929eb483064055.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av kjøretimen i kapittel 27.</p></details><details><summary>Illustration · En mann med navn Ove · 29</summary><p><a href="assets/8c5a0dd6283b4f.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av varmeviftereparasjonen i kapittel 29.</p></details><details><summary>Illustration · En mann med navn Ove · 31</summary><p><a href="assets/2c3a575c87ccda.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av den blokkerte Skodaen i kapittel 31.</p></details><details><summary>Illustration · En mann med navn Ove · 32</summary><p><a href="assets/a882399b3d86d5.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av at Mirsad får husrom i kapittel 32.</p></details><details><summary>Illustration · En mann med navn Ove · 34</summary><p><a href="assets/5019cd88cdf92b.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket ved graven i kapittel 34.</p></details><details><summary>Illustration · En mann med navn Ove · 35</summary><p><a href="assets/fe0f78ff6459ce.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av støtten ved døren i kapittel 35.</p></details><details><summary>Illustration · En mann med navn Ove · 36</summary><p><a href="assets/4e8eeb1bf0c466.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av husbyggerspillet i kapittel 36.</p></details><details><summary>Illustration · En mann med navn Ove · 36</summary><p><a href="assets/0d2fafa5338b00.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av møtet på kaféen i kapittel 36.</p></details><details><summary>Illustration · En mann med navn Ove · 37</summary><p><a href="assets/dee40695c2bafb.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av bildet og tegningen i kapittel 37.</p></details><details><summary>Illustration · En mann med navn Ove · 38</summary><p><a href="assets/4d9937753f9bb3.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av takken etter bursdagsgaven i kapittel 38.</p></details><details><summary>Illustration · En mann med navn Ove · 39</summary><p><a href="assets/b939600bd94822.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av den varsomme pakkingen i kapittel 39.</p></details><details><summary>Illustration · En mann med navn Ove · 40</summary><p><a href="assets/deea09e8229627.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av bryllupet i epilogen.</p></details><details><summary>Illustration · En mann med navn Ove · 40</summary><p><a href="assets/f7ea93981ea84d.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av lysene ve
