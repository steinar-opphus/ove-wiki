      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 1</summary><h2>Introduction</h2><p>Ove er 59 år gammel og kjører Saab.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>En krevende kunde</h2><p>I butikkmøtet opptrer Ove konfronterende: fortelleren beskriver at han lener seg truende over disken, og han presser pekefingeren demonstrativt ned i den.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Datamaskinen og tastaturet</h2><p>Ove vifter med en mellomstor hvit eske ved butikkdisken og sier at han vil ha en vanlig datamaskin. Han spør hvor tastaturet kan foldes ut. Når ekspeditøren forklarer at produktet styres direkte på skjermen, insisterer Ove på at han må ha et tastatur. Ekspeditøren anbefaler en MacBook i stedet.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Ventingen ved disken</h2><p>Ove ser på armbåndsuret og sier at han har andre ting å gjøre enn å vente hele dagen. En kollega av ekspeditøren kommer til og foreslår avdelingen for bærbare datamaskiner.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Hjemmet og morgenrunden</h2><p>Ove og kona har bodd i rekkehusområdet i nesten fire tiår. Huset er nedbetalt. Han pleier å stå opp klokken 05.45 uten vekkerklokke og går en inspeksjonsrunde hver morgen. Han noterer registreringsnumre på gjesteparkeringen og kontrollerer søppelsorteringen på eget initiativ. Denne morgenen skiller han glass fra metall og setter en feilparkert sykkel inn i boden.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>En katt på gangveien</h2><p>Tre uker før butikkmøtet møter Ove katten under morgenrunden, iført blå bukser, blå jakke og tresko. Fortelleren beskriver umiddelbar, gjensidig motvilje. Ove går trampende mot katten og vurderer å kaste en tresko, men noen slik kasting beskrives ikke. Han jager katten, som går sin vei.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Striden om kameraene</h2><p>Ove har vært leder i bostadsrättsföreningen i rekkehusområdet. Han foreslo kameraovervåking av søppelrommene og ble nedstemt. Da han senere var avsatt, kalte han det «statskuppen». Han motsatte seg også et nytt forslag om internettbasert overvåking, og det ble ikke satt opp kameraer.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Naboer sett fra vinduet</h2><p>Ove ser en joggende nabo som han mener heter Anders. Han har også oppfattet at en barnefamilie nylig har flyttet inn rett overfor.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Beskjeden fra jobben</h2><p>Mandagen før tirsdagsscenen fikk Ove beskjed om «arbetsbrist» og at arbeidsplassen skulle fase ut den eldre generasjonen. Han hadde vært der i en tredjedel av et århundre. Tankene hans uttrykker en opplevelse av ikke lenger å ha noen funksjon.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kroken og avbrytelsen</h2><p>Hjemme sier Ove opp telefon- og avisabonnementene og gjør vedlikeholdsarbeid. Han planlegger å feste en særlig solid krok sentrert i stuetaket; formålet er ikke oppgitt. En lang skrapelyd avbryter ham.</p></details><details><summary>Illustration · En mann med navn Ove · 1</summary><p><a href="assets/45ac81b1defc7b.png">Open noncanonical illustration</a></p><p>Ove ved butikkdisken i kapittel 1. Ansikter, klær og interiør er kunstneriske valg.</p></details><details><summary>Illustration · En mann med navn Ove · 2</summary><p><a href="assets/008e386cdeff13.png">Open noncanonical illustration</a></p><p>Ove og katten på gangveien i kapittel 2. Ansikter, lys og husenes utforming er kunstneriske valg.</p></details></noscript>
