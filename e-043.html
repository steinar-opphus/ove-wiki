      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 20</summary><h2>Introduction</h2><p>Lena presenterer seg som journalist i lokalavisen og vil intervjue Ove om redningen på stasjonen.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Veien til intervjuet</h2><p>Lena sier at hun fant Oves navn gjennom betalingsregisteret etter billettkjøpet.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Besøket som endte i garasjen</h2><p>Lena følger etter Ove og blir låst inne i garasjen. Parvaneh åpner og gir henne visittkortet sitt med tilbud om å snakke om Ove. Lena forteller Parvaneh om redningen på stasjonen.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Brevet og telefonsamtalen</h2><p>Lena ringer gjennom Parvaneh og spør igjen om intervju. Hun oppgir å ha sendt brevet og avisen som Adrian leverte.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Granskningen ved døren</h2><p>Lena møter med opptaker og papirer hun beskriver som dokumentasjon om saksbehandlerens tidligere saker. Hun understreker at det kanskje ikke foreligger noe ulovlig, men varsler medieoppmerksomhet og langvarige prosesser. Saksbehandleren går uten Rune. Anders presenterer seg etterpå som Oves venn.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Forsiden og takkebrevet</h2><p>Intervjuet med Ove blir publisert med bilde på forsiden. Brevet hun har sendt videre, viser seg å være underskrevet av mannen han reddet. Lena har fortalt om sykdommen legene fant etter besvimelsen. Hun sier også at hun og Anders skal på skøytetur.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Innflyttingen hos Anders</h2><p>Lena flytter inn hos Anders om høsten. Ove kjører flyttebilen.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Utseende ved første besøk</h2><p>Lena kommer i slitte jeans og en for stor grønn vindjakke, med håret i hestehale.</p></details><details><summary>Illustration · En mann med navn Ove · 22</summary><p><a href="assets/9fb1541a44541d.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av løsningen ved garasjen i kapittel 22.</p></details><details><summary>Illustration · En mann med navn Ove · 35</summary><p><a href="assets/fe0f78ff6459ce.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av støtten ved døren i kapittel 35.</p></details></noscript>
