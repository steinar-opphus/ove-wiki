      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 10</summary><h2>Renoveringen og tapet</h2><p>Ove velger å renovere foreldrehjemmet i stedet for å selge tomten til kommunen. Han lærer byggearbeid og får materialer og råd fra kolleger. Huset står ferdig etter det omfattende arbeidet.</p></details><details><summary>En mann med navn Ove · 10</summary><h2>Renoveringen og tapet</h2><p>En brann i nabohuset sprer seg til hjemmet mens Ove hjelper naboen å redde et barn. Slukking forsinkes av klarering knyttet til kommunegrensen. Huset er overtent da brannvesenet får starte. Ove har betalt for en falsk forsikring, og selskapet finner ingen dekning.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Tomten etter brannen</h2><p>Myndighetsrepresentanten sier at brannutredningen peker på en elektrisk feil. Kommunen presser Ove til å signere over tomten til en pris som gjelder uten huset. Ove signerer og forlater stedet.</p></details><details><summary>Illustration · En mann med navn Ove · 10</summary><p><a href="assets/a3f936f8c8232b.jpg">Open noncanonical illustration</a></p><p>Skånsom kunstnerisk tolkning av øyeblikket etter redningen i kapittel 10.</p></details></noscript>
