      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 6</summary><h2>Introduction</h2><p>Jimmy er en 25 år gammel nabo som Ove har hørt om gjennom kona.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Hjelpen til katten og allergien</h2><p>Jimmy presenterer seg selv ved navn og hjelper til med å varme katten. Han blir rødflammet og forteller at han er allergisk. Ove gir ham et pølsesmørbrød og tilbyr siden sykehusskyss.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Arbeidet med apper</h2><p>På hjemveien fra sykehuset forteller Jimmy at han programmerer iPhone-apper.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Mosjon og en viktig beskjed</h2><p>Jimmy kommer i skarpt grønt treningssett og sier han vil begynne å mosjonere. Han går inspeksjonsrunden sammen med Ove, Mirsad og katten. Han forteller at Anita allerede har anket i over to år etter en søknad om mer hjemmehjelp. Hun ville ifølge ham ikke belaste Ove og Sonja med mer.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Barndommen i nabohuset</h2><p>Jimmy flytter inn som niåring midt i 1990-årene med moren. Faren hadde forlatt dem da han var nyfødt. Naboene hører morens partner slå henne og Jimmy be ham stoppe. Ove og Rune griper inn. Mannen drar, moren og Jimmy vender etter en tid hos Rune og Anita hjem igjen, og økonomisk hjelp gjør at de kan bli boende.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>Hjelp i elektronikkbutikken</h2><p>Jimmy hjelper Ove å kjøpe iPad til jentas åtteårsdag. Selv gir han henne en ledning.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Ekteskap og en datter</h2><p>Jimmy gifter seg med Mirsad, med Ove som forlover og festen på Amels kafé. Amel oppkaller et smørbrød etter ham. Ektefellene bor i Jimmys mors hus. Året etter adopterer de en liten jente, som Jimmy tar med til Anita og Rune hver dag klokken tre.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Utseende</h2><p>Jimmy har langt hår og beskrives som betydelig overvektig.</p></details><details><summary>Illustration · En mann med navn Ove · 33</summary><p><a href="assets/d151bcef7e2174.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av Jimmys morgenmosjon i kapittel 33.</p></details><details><summary>Illustration · En mann med navn Ove · 40</summary><p><a href="assets/deea09e8229627.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av bryllupet i epilogen.</p></details></noscript>
