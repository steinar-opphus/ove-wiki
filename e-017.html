      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 5</summary><h2>Introduction</h2><p>Tom er en høy og bråkete kollega ved jernbanen.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Lommeboken i togvognen</h2><p>Tom er en høy og bråkete mann som arbeider ved jernbanen. Da niårige Ove finner en lommebok, prøver Tom å ta den fra ham. Oves far stiller seg mellom dem, og Ove leverer lommeboken på hittegodskontoret.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Arbeidslederen og den falske anklagen</h2><p>Som arbeidsleder gir Tom Ove de tyngste oppgavene og setter ham i fare. Da han stjeler penger fra billettkassen, legger han skylden på Ove. To yngre kolleger støtter anklagen, mens Ove nekter å angi ham.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Uret og det siste møtet</h2><p>Ove finner farens ur i Toms jakke etter at det forsvinner i dusjen. Ove slår ham én gang. Tom blir sendt til sykehuset og sier at han skled. Dette er siste gang Ove ser ham.</p></details></noscript>
