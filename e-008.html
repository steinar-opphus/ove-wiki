      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 6</summary><h2>Introduction</h2><p>Kvinnen er Anders’ kjæreste og omtaler hunden Prince som sin.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Konflikten med katten</h2><p>Kvinnen kaster steiner mot katten og sier at den klorte hunden hennes, som hun kaller Prince. Ove stopper henne og krever at hunden skal være i bånd. Hun varsler at hun vil ta opp saken med Anders.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Trusselen om hjemmet</h2><p>Kvinnen sier til Ove at Skoda-passasjerene er fra sosialtjenesten og håner ham med at Rune er den som flyttes til hjem nå, mens Ove blir neste. Dette er hennes utsagn, ikke et bekreftet vedtak om Ove.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Angrepet på katten</h2><p>Kvinnen har grønne øyne. Hun forsøker å sparke katten, som slipper unna sparket, men har nye sår etter sammenstøtet med henne og hunden.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Forholdet er slutt</h2><p>Anders sier hun har flyttet ut, at forholdet er slutt og at hun hadde en affære i noen måneder. Dette er hans forklaring.</p></details></noscript>
