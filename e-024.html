      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 29</summary><h2>Introduction</h2><p>Mirsad er den unge kafélederen som Adrian presenterer som sjefen sin.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Omsorg og en fortrolig opplysning</h2><p>Mirsad gir smørbrød til mannen ved husveggen. I samtalen med Ove bekrefter han at han er homofil. Ifølge Adrian vet faren det ikke.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>En natt uten et hjem</h2><p>Mirsad kommer uten sminke til Ove sammen med Adrian. Han sier han har fortalt faren Amel at han er homofil og blitt nektet å bo hjemme. Han sier han ikke har slekt i byen og ikke kan sove hos Adrian denne natten. Mirsad blir boende hos Ove.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Frokost og en morgenrunde</h2><p>Mirsad lager ristet brød og kaffe og blir med Ove, Jimmy og katten på runden. Han forklarer at oppholdet er midlertidig. Ove stanser Jimmys spørsmål om konflikten med faren.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>En samtale på to språk</h2><p>Mirsad og faren Amel snakker i Oves kjøkken om skuffelser, håp, mannlighet og mot. Den konkrete ordvekslingen blir ikke gjengitt.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Et hjem med Jimmy</h2><p>Mirsad gifter seg med Jimmy på rådhuset. Ove er forlover, og festen holdes på Amels kafé. De bor i Jimmys mors hus og adopterer en datter året etter.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Utseende ved kafébesøket</h2><p>Mirsad er spinkel og har svart øyesminke ved kafébesøket.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Det tidligere møtet</h2><p>Han er den samme unge mannen som tidligere fulgte Adrian ved boden.</p></details><details><summary>Illustration · En mann med navn Ove · 32</summary><p><a href="assets/a882399b3d86d5.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av at Mirsad får husrom i kapittel 32.</p></details><details><summary>Illustration · En mann med navn Ove · 40</summary><p><a href="assets/deea09e8229627.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av bryllupet i epilogen.</p></details></noscript>
