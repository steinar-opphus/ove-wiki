      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 4</summary><h2>Armbåndsurets historie</h2><p>Faren døde få dager etter at Ove fylte 16. Ove arvet armbåndsuret hans. Faren hadde selv fått det fra sin far samme år som han fylte 19.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Jernbanearbeideren og oppdragelsen</h2><p>Faren arbeidet på jernbanen og var dyktig med motorer. Han var tynn, med tjafsete hår, grove hender og markerte armmuskler. Han beskrives som stillferdig og snill og sa at familien ikke skulle slåss.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Jernbanearbeideren og oppdragelsen</h2><p>Etter en bilreparasjon ved direktørfamiliens bryllup tok han med brød og kjøtt hjem til Ove. Senere fikk han en skadet Saab 92 av direktøren og lærte Ove mekanikk på den.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Jernbanearbeideren og oppdragelsen</h2><p>Han beskyttet Ove mot Tom og fulgte sønnen til hittegodskontoret med pengene. Han døde på grunn av en løpsk vogn ved jernbanen.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Utseende</h2><p>Faren er tynn og har tjafsete hår, markerte armmuskler og grove hender.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Væremåte</h2><p>Faren beskrives som stillferdig og snill. Han sa at familien ikke skulle slåss.</p></details><details><summary>Illustration · En mann med navn Ove · 4</summary><p><a href="assets/9a752612a08aad.jpg">Open noncanonical illustration</a></p><p>Portrett av Oves far. Ansikt og øvrige udokumenterte detaljer er kunstnerisk tolkning.</p></details><details><summary>Illustration · En mann med navn Ove · 5</summary><p><a href="assets/f291221a446032.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av innleveringen på hittegodskontoret i kapittel 5.</p></details></noscri
