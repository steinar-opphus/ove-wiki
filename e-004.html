      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 2</summary><h2>Introduction</h2><p>Katten er dyret Ove møter på gangveien mellom husene klokken 05.55.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Utseendet ved første møte</h2><p>Katten har en halv hale, bare ett øre og flere flekker med manglende pels. Årsaken oppgis ikke.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Møtet på gangveien</h2><p>Fortelleren beskriver at katten og Ove straks misliker hverandre. Da Ove tramper mot den, reiser den seg. Han jager den, og den går sin vei.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Steinene ved boden</h2><p>Anders’ kjæreste kaster steiner mot katten, som sitter ved Oves hus med små blodflekker i pelsen. Hun hevder at den klorte hunden Prince. Ove griper inn og stopper henne. Katten går senere rundt hjørnet av boden.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Arret i snømorgenen</h2><p>I kapittel 11 beskrives et langt arr over ett øye og ned på nesen. Ove sparker en tresko som bommer på katten, og skyfler senere litt snø mot den. Den hopper unna og går.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Funnet i snøfonnen</h2><p>Ved slutten av kapittel 15 finner Ove katten liggende i et katteformet hull i snøfonnen ved boden. Tilstanden fastslås ikke i dette kapittelet.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Oppvarmingen hos Ove</h2><p>Parvaneh løfter katten ut av snøen og tar den inn til Ove. Jimmy holder den mot kroppen for å varme den. Parvaneh merker bedring, og katten begynner igjen å bevege halen. Ove gir midlertidig tillatelse til at den får bli.</p></details><details><summary>En mann med navn Ove · 19</summary><h2>Hos veterinæren og ved graven</h2><p>En veterinær undersøker katten og oppgir alvorlige frostskader og sterk underernæring. Ove får instrukser om stell og tar små sokker på alle fire potene. Katten følger inspeksjonsrunden og får tunfisk.</p></details><details><summary>En mann med navn Ove · 19</summary><h2>Hos veterinæren og ved graven</h2><p>Ved Sonjas grav forteller Ove at katten bor hos dem. Den legger varsomt hodet i hånden hans. Dette skjer etter en mer stridbar biltur der katten bet ham i fingeren.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Nye sår og en avbrutt hevn</h2><p>Katten får nye sår langs siden etter sammenstøtet med hunden og kvinnen. Ove slipper den inn og gir den vann. Hans planlagte hevnfelle blir fjernet før bruk.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Ved Oves side</h2><p>Parvaneh finner katten ved siden av Ove etter at han er død. Katten kryper opp i fanget hennes.</p></details><details><summary>Illustration · En mann med navn Ove · 2</summary><p><a href="assets/6ddc02db590eab.jpg">Open noncanonical illustration</a></p><p>Kattens utseende ved første møte i kapittel 2. Pelsfarge og øyne er kunstneriske valg.</p></details><details><summary>Illustration · En mann med navn Ove · 2</summary><p><a href="assets/008e386cdeff13.jpg">Open noncanonical illustration</a></p><p>Ove og katten på gangveien i kapittel 2. Ansikter, lys og husenes utforming er kunstneriske valg.</p></details><details><summary>Illustration · En mann med navn Ove · 6</summary><p><a href="assets/971e84a9f26899.jpg">Open noncanonical illustration</a></p><p>Skånsom kunstnerisk tolkning av Oves inngripen i kapittel 6.</p></details><details><summary>Illustration · En mann med navn Ove · 11</summary><p><a href="assets/f48cd9120f135b.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk detaljtolkning av arret beskrevet i kapittel 11.</p></details><details><summary>Illustration · En mann med navn Ove · 15</summary><p><a href="assets/0a118547b80a42.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av funnet i snøfonnen ved slutten av kapittel 15.</p></details><details><summary>Illustration · En mann med navn Ove · 17</summary><p><a href="assets/fff6710cc8ebcb.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av katten som blir tatt inn i kapittel 17.</p></details><details><summary>Illustration · En mann med navn Ove · 19</summary><p><a href="assets/c4855707e6894f.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket med katten i kapittel 19.</p></details></noscript>
