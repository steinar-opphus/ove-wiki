      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 3</summary><h2>Maten til Ove</h2><p>Ved introduksjonen er den navnløse jenta sju år, svarthåret og har brune øyne. Hun kommer med Nasanin til Ove med middag og forklarer at moren syntes han så sulten ut.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Storesøsteren i venterommet</h2><p>Hun er Nasanins storesøster og sier at hun snart fyller åtte. Begge er Parvanehs døtre. På sykehuset ber hun Ove lese med eventyrstemmer, og hun forsvarer ham senere ved å si at klovnen ikke var flink.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Hus på papir og skjerm</h2><p>Jenta har svart-hvite blyantskisser av hus på veggene og spiller et spill der hun bygger hus og byer. Hun og Ove blir sittende i to og en halv time før Parvaneh sender dem i seng. Hun viser ham også tegningen av huset hans.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>En invitasjon og et ønske</h2><p>Jenta inviterer Ove i fødselsdagsselskap og forteller i fortrolighet at hun ønsker seg en iPad med tegneprogrammer for barn.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>Åtteårsdagen og gaven</h2><p>Jenta fyller åtte år. Ove gir henne en iPad, og Jimmy en ledning. Hun gir Ove en klem og sier «Takk morfar», et valgt familienavn uten påvist biologisk forbindelse.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Tegningene og minnene</h2><p>Ove godtar at jentene kaller ham morfar og setter tegningene på kjøleskapet. De hjelper Parvaneh med å pakke Sonjas ting og sovner etterpå på sofaen.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Etter tiårsdagen</h2><p>Epilogen beskriver jenta som tiåring og omtaler hennes første pysjamasfest. Oves brev tilgodeser hvert av Parvanehs barn med én million ved atten år.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Utseende</h2><p>Jenta er svarthåret og har brune øyne.</p></details><details><summary>Illustration · En mann med navn Ove · 13</summary><p><a href="assets/54d4ba46f15896.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av lesestunden på sykehuset i kapittel 13.</p></details><details><summary>Illustration · En mann med navn Ove · 36</summary><p><a href="assets/4e8eeb1bf0c466.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av husbyggerspillet i kapittel 36.</p></details><details><summary>Illustration · En mann med navn Ove · 38</summary><p><a href="assets/4d9937753f9bb3.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av takken etter bursdagsgaven i kapittel 38.</p></details></noscript>
