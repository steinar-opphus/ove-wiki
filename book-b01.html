      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 1</summary><h2>Introduction</h2><p>Ove er 59 år og kjører Saab. I åpningskapittelet møter vi ham ved en butikkdisk, der han vil ha en vanlig datamaskin.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Kapittel 1 – Ove i databutikken</h2><p>Ove er 59 år og kjører Saab. Ved en butikkdisk vifter han med en mellomstor hvit eske, som ekspeditøren identifiserer som en iPad. Ove vil ha en vanlig datamaskin og spør hvor tastaturet kan foldes ut. Ekspeditøren forklarer at produktet styres på skjermen, mens Ove insisterer på at han må ha tastatur.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Kapittel 1 – Ove i databutikken</h2><p>Ekspeditøren anbefaler en MacBook og forklarer at den har tastatur. Ove ser på klokken og klager over ventingen. En kollega overtar og foreslår avdelingen for bærbare datamaskiner. Den første ekspeditøren melder at han tar lunsj; Ove svarer med en nedsettende generalisering om folks opptatthet av lunsj.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Fortellingen går tre uker tilbake. På sin faste morgenrunde møter Ove en katt klokken 05.55. Katten har halv hale, ett øre og flekkvis manglende pels. Ove går trampende mot den; etter at han jager den, går den sin vei.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Oves runde i rekkehusområdet omfatter garasjene og registreringsnumrene på gjesteparkeringen. Han retter søppelsorteringen og flytter en sykkel inn i boden, før han river ned en sint lapp. Ove har tidligere vært leder i foreningen og blitt avsatt; selv kaller han det «statskuppen».</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Hjemme sier Ove opp telefon- og avisabonnementene og utfører vedlikehold. Tirsdag ettermiddag i november tenker han tilbake på beskjeden fra jobben dagen før om «arbetsbrist» og utfasing av eldre ansatte. Han har vært på samme arbeidsplass i en tredjedel av et århundre. Han planlegger å feste en solid krok i stuetaket, men avbrytes av en skrapelyd som teksten ennå ikke forklarer.</p></details></noscript>
