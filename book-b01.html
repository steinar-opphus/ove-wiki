      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 1</summary><h2>Introduction</h2><p>Ove er 59 år og kjører Saab. I åpningskapittelet møter vi ham ved en butikkdisk, der han vil ha en vanlig datamaskin.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Kapittel 1 – Ove i databutikken</h2><p>Ove er 59 år og kjører Saab. Ved en butikkdisk vifter han med en mellomstor hvit eske, som ekspeditøren identifiserer som en iPad. Ove vil ha en vanlig datamaskin og spør hvor tastaturet kan foldes ut. Ekspeditøren forklarer at produktet styres på skjermen, mens Ove insisterer på at han må ha tastatur.</p></details><details><summary>En mann med navn Ove · 1</summary><h2>Kapittel 1 – Ove i databutikken</h2><p>Ekspeditøren anbefaler en MacBook og forklarer at den har tastatur. Ove ser på klokken og klager over ventingen. En kollega overtar og foreslår avdelingen for bærbare datamaskiner. Den første ekspeditøren melder at han tar lunsj; Ove svarer med en nedsettende generalisering om folks opptatthet av lunsj.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Fortellingen går tre uker tilbake. På sin faste morgenrunde møter Ove en katt klokken 05.55. Katten har halv hale, ett øre og flekkvis manglende pels. Ove går trampende mot den; etter at han jager den, går den sin vei.</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Oves runde i rekkehusområdet omfatter garasjene og registreringsnumrene på gjesteparkeringen. Han retter søppelsorteringen og flytter en sykkel inn i boden, før han river ned en sint lapp. Ove har tidligere vært leder i foreningen og blitt avsatt; selv kaller han det «statskuppen».</p></details><details><summary>En mann med navn Ove · 2</summary><h2>Kapittel 2 – Inspeksjonsrunden</h2><p>Hjemme sier Ove opp telefon- og avisabonnementene og utfører vedlikehold. Tirsdag ettermiddag i november tenker han tilbake på beskjeden fra jobben dagen før om «arbetsbrist» og utfasing av eldre ansatte. Han har vært på samme arbeidsplass i en tredjedel av et århundre. Han planlegger å feste en solid krok i stuetaket, men avbrytes av en skrapelyd som teksten ennå ikke forklarer.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Kapittel 3 – Tilhengeren og middagen</h2><p>En tilhenger skraper langs Oves hus. Den gravide kvinnen og mannen hennes er de nye naboene. Da tilhengeren også bøyer Oves postkasse, overtar han rattet og rygger den på plass. Begge takker ham.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Kapittel 3 – Tilhengeren og middagen</h2><p>Senere kommer Nasanin og en sjuårig jente med middag fra moren. Ove setter maten i kjøleskapet og spiser den om kvelden. Han får ikke opp kroken denne dagen og bestemmer seg for morgendagen.</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Kapittel 4 – To blomster</h2><p>Ove drar til blomsterbutikken. På veien hindrer han en Mercedes-fører i å få en parkeringsplass, men oppdager at Toyotaen han slapp til, tilhører den blonde naboen. Mannen begynner å si navnet sitt, men blir avbrutt etter «Pat…».</p></details><details><summary>En mann med navn Ove · 4</summary><h2>Kapittel 4 – To blomster</h2><p>Ove får én blomst slått inn til halvparten av kupongprisen, men kortgebyret gjør at han ender med to. Han besøker kona, planter de rosa blomstene og sier at han savner henne. Først nå fastslår teksten at hun døde for seks måneder siden.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Kapittel 5 – Faren, bilen og lommeboken</h2><p>Tilbakeblikket skildrer Oves oppvekst. Moren dør da han er sju. Faren, som jobber ved jernbanen, lærer ham om motorer. Etter gaven av en Saab 92 bestemmer åtteåringen seg for alltid å kjøre Saab.</p></details><details><summary>En mann med navn Ove · 5</summary><h2>Kapittel 5 – Faren, bilen og lommeboken</h2><p>Som niåring finner Ove en lommebok. Faren beskytter ham mot Tom, og de leverer pengene til hittegodskontoret. Etter farens død begynner Ove ved jernbanen i stedet for å fortsette på skolen. Fem år senere ser han sin framtidige kone på et tog.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Kapittel 6 – Sykkelen og kattens forsvar</h2><p>Oves dødsønske og forberedelser blir uttrykkelige. Han møter også en ungdom som protesterer når han setter en punktert sykkel inn i boden.</p></details><details><summary>En mann med navn Ove · 6</summary><h2>Kapittel 6 – Sykkelen og kattens forsvar</h2><p>Ved huset oppdager Ove at Anders’ kjæreste kaster steiner mot katten. Hun hevder at katten klorte hunden Prince. Ove tar kattens parti og stanser kvinnen. Katten blir sittende og går først senere rundt boden.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Kapittel 7 – Kaker og avbrudd</h2><p>Ove forbereder et selvmord, men avbrytes av naboene. De kommer med kaker og presenterer seg som Parvaneh og Patrick. Parvaneh forklarer at hun er fra Iran, mens Patrick sier at han er IT-konsulent. Han låner en stige og sekskantnøkler.</p></details><details><summary>En mann med navn Ove · 7</summary><h2>Kapittel 7 – Kaker og avbrudd</h2><p>Anita ber om hjelp med radiatorene og forteller om Runes sykdom. Hun navngir Sonja og begynner å forklare sporene i Oves gulv, men han avbryter henne rasende. Etter at naboene går, forsøker han å henge seg. Utfallet er ikke kjent ved kapitlets slutt.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Kapittel 8 – Tausheten og den nye jobben</h2><p>Etter de første ukene får Ove fortsette ved jernbanen. Tom blir arbeidsleder og plager ham. Da Tom stjeler penger og skylder på Ove, nekter Ove å angi ham. To kolleger støtter Toms falske anklage.</p></details><details><summary>En mann med navn Ove · 8</summary><h2>Kapittel 8 – Tausheten og den nye jobben</h2><p>Direktøren lar Ove si opp, men gir ham ny jobb som nattvasker og viser til ærligheten hans som niåring. Etter to år i denne jobben møter Ove Sonja, med røde sko, gullbrosje og gyllenbrunt hår.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Kapittel 9 – Tauet ryker, og Ove går til Anita</h2><p>Ove tenker på de første årenes kameratskap med Rune, da de startet styret sammen og motsatte seg kommunens byggeplaner. Sonja og Anita ble bestevenner. Ove kjenner også savnet etter Rune.</p></details><details><summary>En mann med navn Ove · 9</summary><h2>Kapittel 9 – Tauet ryker, og Ove går til Anita</h2><p>Tauet ryker, og Ove overlever fallet. Han rydder bort forberedelsene og går til Anita med skiftenøkkel og plastkanne for å hjelpe med radiatorene. Han ser Rune sittende i rullestol i stuen.</p></details><details><summary>En mann med navn Ove · 10</summary><h2>Kapittel 10 – Huset og brannen</h2><p>Unge Ove kjøper en blå Saab 93 og bestemmer seg for å restaurere barndomshjemmet i stedet for å selge til kommunen. Han lærer byggfaget gjennom ekstra arbeid og får hjelp og materialer av kolleger. En mann selger ham det han tror er husforsikring.</p></details><details><summary>En mann med navn Ove · 10</summary><h2>Kapittel 10 – Huset og brannen</h2><p>Da naboens hus brenner, går Ove inn for å rydde vei. Naboen bærer barnebarnet ut, men ilden sprer seg til Oves hus. Slukkingen blir forsinket av krav om klarering over kommunegrensen. Huset blir overtent, og forsikringsselskapet finner ingen forsikring.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Kapittel 11 – Snøen og skyssen til sykehuset</h2><p>Årets første ordentlige snø har kommet. Ove jager katten og måker før han møter en Skoda-fører som ignorerer protestene mot bilkjøring. Anita sier at mannen kommer fra kommunen og vil ta Rune fra henne.</p></details><details><summary>En mann med navn Ove · 11</summary><h2>Kapittel 11 – Snøen og skyssen til sykehuset</h2><p>Et nytt selvmordsforsøk blir avbrutt av Parvaneh, som får porten i ansiktet når Ove åpner. Patrick har ifølge henne falt fra stigen og er kjørt til sykehuset. Hun mangler førerkort og trenger skyss med barna; Ove gjør seg klar til å kjøre.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Kapittel 12 – Tomten, uret og hjertet</h2><p>Etter brannen signerer Ove papirene om tomten og leier et rom i byen. På jobb finner han farens bortkomne ur i Toms jakke. Han slår Tom, som havner på sykehuset og sier at han skled. De møtes aldri igjen.</p></details><details><summary>En mann med navn Ove · 12</summary><h2>Kapittel 12 – Tomten, uret og hjertet</h2><p>Ove slutter på byggeplassen og får nye verktøy i gave. Han ønsker å bli militær, men et sjeldent medfødt hjerteproblem fører til fritak. Han vender tilbake til nattarbeidet og bilene. Tilbakeblikket ender med Sonja, med blå øyne og stor gul hårspenne.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Kapittel 13 – Bildeboken og Beppo</h2><p>På sykehuset krangler Ove om parkering og passer Nasanin og storesøsteren mens Parvaneh besøker Patrick. Han leser om et lite tog, men den eldste mener han må bruke eventyrstemmer.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Kapittel 13 – Bildeboken og Beppo</h2><p>Et trylletriks med Beppo ender med at Ove blir holdt tilbake av vaktene. Nasanin sier han slo klovnen, mens Ove nedtoner det og viser til feil femkrone. Patrick må ifølge Parvaneh bli på sykehuset med gips på arm og ben. Tilbake hjemme ber hun Ove om mer hjelp, og han henter verktøy.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Kapittel 14 – Togreisene og restaurantkvelden</h2><p>Ove følger Sonja på toget etter nattskiftet. Hun studerer til lærer og elsker bøker. Han lyver om militærtjeneste og følger de samme reisene i tre måneder før hun selv bestemmer en restaurantavtale.</p></details><details><summary>En mann med navn Ove · 14</summary><h2>Kapittel 14 – Togreisene og restaurantkvelden</h2><p>Under middagen forteller Ove sannheten. Sonja har allerede forstått løgnen og oppmuntrer drømmen hans om å bygge hus. Hun finner et korrespondansekurs, og Ove tar flere kurs og får jobb på byggekontoret. De kjøper rekkehus og blir et par som vil gifte seg og ha barn. Tilbakeblikket ender med Sonjas død, med hånden i hans.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Kapittel 15 – Mannen på sporet og katten i snøen</h2><p>Ove går til stasjonen med en selvmordsplan. Når en mann besvimer og faller på sporet, hopper han ned og hjelper ham opp med bistand fra ungdommer. Ove blir et øyeblikk stående, men øyekontakten med den unge lokføreren får ham til å trekke seg unna.</p></details><details><summary>En mann med navn Ove · 15</summary><h2>Kapittel 15 – Mannen på sporet og katten i snøen</h2><p>På vei hjem møter Ove den hvite Skodaen og blir hånet av Anders’ kjæreste om at også han vil havne på hjem. Han blir tungpustet. Ved boden finner han katten liggende i et hull i snøfonnen, uten at tilstanden er kjent ennå.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Kapittel 16 – Sonjas far og lastebilen</h2><p>Tilbakeblikket viser Sonjas kjærlighet til bøker, faren og katter. Faren lever alene nordpå etter konas død. Den store gårdskatten Ernest, oppkalt etter Hemingway, kommer og går uten eier.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Kapittel 16 – Sonjas far og lastebilen</h2><p>Ved første besøk får Ove og faren lite sagt til hverandre før lastebilen blir tema. Ove tilbyr seg å se på den og begynner å arbeide under panseret. Når faren sier at Ove får lære å fiske, oppfatter Sonja det som en stor kompliment.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Kapittel 17 – Katten kommer inn</h2><p>Parvaneh tar den kalde katten inn til Ove, som henter et teppe. Jimmy kommer inn og hjelper med å varme den. Katten blir varmere, og Ove merker lettelse.</p></details><details><summary>En mann med navn Ove · 17</summary><h2>Kapittel 17 – Katten kommer inn</h2><p>På kjøkkenet oppdager Parvaneh senkede benker og hjulspor etter en tidligere ulykke og beklager at hun gikk inn uten å spørre. Jimmy får en allergisk reaksjon, og Ove kjører til sykehuset igjen. Denne gangen lar han Parvaneh betale parkeringen.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>Kapittel 18 – Avskjed og en beskjed i bilen</h2><p>Sonjas far dør en juninatt. Sonja sørger, mens Ove holder seg i arbeid ved skogshuset. Kort etter blir Ernest påkjørt. De tar ham til veterinæren, men han dør og gravlegges ved fiskevannet.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>Kapittel 18 – Avskjed og en beskjed i bilen</h2><p>På hjemveien forteller Sonja indirekte at hun er gravid og foreslår at de kjøper eget hus. Ove tar inn beskjeden og svarer at de trenger stasjonsvogn.</p></details><details><summary>En mann med navn Ove · 19</summary><h2>Kapittel 19 – Sokkene og besøket hos Sonja</h2><p>Veterinæren har fastslått alvorlige frostskader og underernæring hos katten og gitt Ove råd om stellet. Ove tar sokker på potene og lar katten følge inspeksjonsrunden før han gir den tunfisk.</p></details><details><summary>En mann med navn Ove · 19</summary><h2>Kapittel 19 – Sokkene og besøket hos Sonja</h2><p>På ærend blir det konflikt i bilen, men ved Sonjas grav presenterer Ove katten som en som nå bor hos dem. Katten legger forsiktig hodet i hånden hans.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Kapittel 20 – Barnesengene og journalisten</h2><p>Ove minnes vennskapet med Rune under Sonjas og Anitas graviditeter. De laget to lyseblå sprinkelsenger, og parene var de eneste til stede da Ove og Sonja giftet seg i rådhuset.</p></details><details><summary>En mann med navn Ove · 20</summary><h2>Kapittel 20 – Barnesengene og journalisten</h2><p>I nåtiden vil Lena intervjue Ove om redningen. Han blir avledet av den hvite Skodaen. Føreren sier at de skal ta hånd om Rune og at avgjørelsen ikke er Anitas. Mannens kunnskap om Oves navn gjør Ove urolig og vekker minner om myndighetene etter ulykken i Spania.</p></details><details><summary>En mann med navn Ove · 21</summary><h2>Kapittel 21 – Uken i Spania</h2><p>Ove og Sonja reiser med buss til Spania. På turene mens hun hviler hjelper Ove José med en bil og andre mennesker med praktisk arbeid. De spiser gratis hos José resten av uken.</p></details><details><summary>En mann med navn Ove · 21</summary><h2>Kapittel 21 – Uken i Spania</h2><p>På hjemreisen kjenner Ove barnet sparke for første gang. Fortelleren betegner uken som hans lykkeligste og varsler at den verste følger, uten ennå å forklare hendelsen.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Kapittel 22 – Lena bak garasjeporten</h2><p>Lena kommer igjen for å intervjue Ove, som prøver å unnslippe og ender med å låse henne inne i garasjen. Parvaneh oppdager situasjonen og får høre om redningen.</p></details><details><summary>En mann med navn Ove · 22</summary><h2>Kapittel 22 – Lena bak garasjeporten</h2><p>Parvaneh lover å hjelpe med Lena dersom Ove gir sykehusskyss. Hun åpner porten og gir journalisten visittkortet. Ove ender med å vente utenfor sykehuset med katten, mens han forsikrer den om at saken om Rune vil ta lang tid.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Kapittel 23 – Ulykken og livet etterpå</h2><p>Bussen kolliderer på hjemreisen fra Spania. Sonja våkner den tiende dagen, men barnet hun og Ove ventet er gått tapt. Hun bruker rullestol og vil begynne rehabiliteringen.</p></details><details><summary>En mann med navn Ove · 23</summary><h2>Kapittel 23 – Ulykken og livet etterpå</h2><p>Ove bygger om hjemmet. Sonja fullfører utdanningen og tar en krevende lærerjobb. Når hun ber ham stanse den langvarige brevstriden, bygger han selv rampen skolen trenger.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Kapittel 24 – Ove i farger</h2><p>På hjemveien nekter Ove å sende katten på hjem. Parvaneh ber om kjøretimer og gir ham Nasanins tegning, hvor han er den eneste som er tegnet i farger.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Kapittel 24 – Ove i farger</h2><p>Hjemme slår Ove av motoren etter å ha sett på katten. Neste morgen måker han også foran naboenes hus.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Kapittel 25 – Bølgeblikk og omsorg</h2><p>Ove avbryter en ny selvmordsplan når katten blir angrepet. Han besøker Rune og Anita for å låne bølgeblikk, hører om myndighetenes press og tilbyr hjelp med radiatorene.</p></details><details><summary>En mann med navn Ove · 25</summary><h2>Kapittel 25 – Bølgeblikk og omsorg</h2><p>Ove planlegger hevn mot hunden, men fjerner fellen før den brukes.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>Kapittel 26 – En elev og en sykkel</h2><p>Den unge postmannen forteller Ove at Sonja var læreren som trodde på ham og fikk ham til å lese Shakespeare. Ove tilbyr å gi ham sykkelen tilbake. Ungdommen vil reparere den for en jente han er forelsket i.</p></details><details><summary>En mann med navn Ove · 26</summary><h2>Kapittel 26 – En elev og en sykkel</h2><p>Ove avtaler deretter øvelseskjøring med Parvaneh i sin bil.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Kapittel 27 – Den første kjøretimen</h2><p>Sonjas forklaring av Ove og Runes fiendskap følger bilbyttene og BMW-kjøpet, uten å hevde at bilene forklarer alt.</p></details><details><summary>En mann med navn Ove · 27</summary><h2>Kapittel 27 – Den første kjøretimen</h2><p>Parvanehs første kjøretime starter vanskelig. Ove går voldsomt til rette med en tutende fører og vender så tilbake med oppmuntring. Den ettermiddagen lærer hun å kjøre.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Kapittel 28 – Stridene og det som lå bak</h2><p>Historien følger Ove og Rune gjennom nabokonflikter om gjerder, plen, trær, snø, vinduer og grilling. Etter robotklipperhendelsen kommer Rune på sykehus, og striden ebber ut.</p></details><details><summary>En mann med navn Ove · 28</summary><h2>Kapittel 28 – Stridene og det som lå bak</h2><p>Bilbyttene får en bakgrunn i rullestol, barnevogn og barn som ikke kom. Johan flytter hjemmefra; Rune sier sports-BMW-en passer når det bare er ham og Anita. Fortellerens tanker om sorg og tilgivelse er formulert som muligheter.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Kapittel 29 – Adrian, Mirsad og kaféen</h2><p>På kaféen får Ove vite at postmannen heter Adrian. Han hjelper Adrian å reparere sykkelen. Den unge mannen med sminke heter Mirsad og bekrefter at han er homofil; ifølge Adrian vet faren Amel det ikke.</p></details><details><summary>En mann med navn Ove · 29</summary><h2>Kapittel 29 – Adrian, Mirsad og kaféen</h2><p>Amel eier kaféen. Ove reparerer varmeviften etter å ha krevd at katten får bli.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Kapittel 30 – Alt som var vanlig</h2><p>Ved Sonjas grav minnes Ove de faste hverdagene med skolekjøring, måltider og små lørdagsturer. Kreftdiagnosen kom fire år tidligere; Sonja arbeidet stadig mindre, skrev til elevene og døde det fjerde året.</p></details><details><summary>En mann med navn Ove · 30</summary><h2>Kapittel 30 – Alt som var vanlig</h2><p>Ove uttrykker en ny selvmordsplan. På hjemveien tilbyr Parvaneh å hjelpe med Sonjas ting, men han avviser henne sint.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Kapittel 31 – En tilhenger på tvers</h2><p>Parvaneh avbryter Oves nye selvmordsplan med en telefon fra Lena. Kort etter ber Ove Patrick skaffe tilhengeren igjen; en tilhenger sperrer siden den hvite Skodaen inne.</p></details><details><summary>En mann med navn Ove · 31</summary><h2>Kapittel 31 – En tilhenger på tvers</h2><p>Anita sier Rune skal hentes samme uke. Ove avviser henne og Parvaneh, hevder anker vil ta årevis, og sitter deretter med skjelving, hjertebank og brysttrykk.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>Kapittel 32 – Husrom til Mirsad</h2><p>Adrian og Mirsad kommer om natten og avbryter Oves selvmordsforberedelser. Ove skremmer dem med et gevær. Mirsad sier han er blitt kastet ut etter å ha fortalt faren at han er homofil.</p></details><details><summary>En mann med navn Ove · 32</summary><h2>Kapittel 32 – Husrom til Mirsad</h2><p>Til tross for Oves protest om at huset ikke er et hotell, blir Mirsad boende hos ham.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Kapittel 33 – Tiden de ikke hadde</h2><p>Ove får følge av Mirsad, Jimmy og katten på morgenrunden. Jimmy forteller at Anita allerede har anket i over to år og ikke ville belaste Ove og Sonja.</p></details><details><summary>En mann med navn Ove · 33</summary><h2>Kapittel 33 – Tiden de ikke hadde</h2><p>Ove innrømmer at han trodde prosessen nettopp hadde begynt. Han går til Anita og ber om myndighetspapirene.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Kapittel 34 – Naboene og en ny plan</h2><p>Et tilbakeblikk viser hvordan Ove og Rune grep inn da Jimmy og moren levde med vold, og siden hjalp dem økonomisk.</p></details><details><summary>En mann med navn Ove · 34</summary><h2>Kapittel 34 – Naboene og en ny plan</h2><p>Nå bidrar Anders med bilberging: Skodaen flyttes. Anita får likevel et brev med tidspunkt for henting. Ved Sonjas grav sier Ove at han ikke har tid til å dø nå.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Kapittel 35 – Ingen står alene</h2><p>Ove har restaurert den lyseblå barnesengen til Parvaneh. Da Rune skal hentes, står Anita og naboene samlet.</p></details><details><summary>En mann med navn Ove · 35</summary><h2>Kapittel 35 – Ingen står alene</h2><p>Lena og Patrick legger frem papirer og varsler granskning. Saksbehandleren går med pleierne uten Rune. Etterpå snakker Ove og Rune alene.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Kapittel 36 – Hus, historier og to glass</h2><p>Ove spiser hos Parvaneh, leser for Nasanin og spiller husbyggerspill med storesøsteren. Hun viser ham tegningen av huset hans.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Kapittel 36 – Hus, historier og to glass</h2><p>Ove oppsøker Amel og ber om whiskyen han ble tilbudt. Amel setter en flaske og to glass mellom dem.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Kapittel 37 – Et bilde å beholde</h2><p>Ove havner på forsiden etter intervjuet. Han leser takkebrevet fra mannen han reddet og setter det vedlagte bildet på kjøleskapet. Naboene blir med til Sonjas grav.</p></details><details><summary>En mann med navn Ove · 37</summary><h2>Kapittel 37 – Et bilde å beholde</h2><p>Amel og Mirsad snakker på Oves kjøkken. Senere inviterer den eldste jenta Ove i bursdag og forteller at hun ønsker seg en iPad til å tegne på.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>Kapittel 38 – Takk, morfar</h2><p>Ove kjøper iPad med Jimmys hjelp. Jenta fyller åtte, klemmer ham og takker med «morfar». Han avtaler øvelseskjøring med Parvaneh neste morgen.</p></details><details><summary>En mann med navn Ove · 38</summary><h2>Kapittel 38 – Takk, morfar</h2><p>På kveldsrunden oppdager Ove tre innbruddstyver. Han faller med brystsmerter og pustevansker. Tyvene flykter, og han hører Parvaneh komme før alt blir mørkt.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Kapittel 39 – Hjem og videre</h2><p>Ove overlever. Legen sier han har en hjertefeil, forklart som et for stort hjerte, som kan kontrolleres med medisiner med usikker prognose. Parvaneh er registrert som nærmeste pårørende.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Kapittel 39 – Hjem og videre</h2><p>Hjemme fire dager senere godtar Ove morfar-navnet. Parvaneh og jentene hjelper ham å pakke Sonjas ting. Samme kveld drar de til sykehuset igjen, og Parvaneh føder en gutt.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Epilog – Årene og arven etter Ove</h2><p>Parvaneh består førerprøven. Lena flytter inn hos Anders, og Jimmy og Mirsad gifter seg og adopterer senere en datter. Ove hjelper naboer, følger Nasanin til skolestart og har fått en ny plass i fellesskapet.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Epilog – Årene og arven etter Ove</h2><p>Nesten fire år etter innflyttingen finner Parvaneh Ove død. Brevet hans fordeler bilen og pengene etter Sonjas far, med penger til barna. Mer enn tre hundre kommer i begravelsen, og Parvaneh oppretter Sonjas fond for foreldreløse barn. Hun viser huset til et ungt par; mannen kjører Saab.</p></details></noscript>
