      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 3</summary><h2>Middagen på dørstokken</h2><p>Ved introduksjonen er Nasanin tre år gammel. Hun er svarthåret og har brune øyne. Navnet blir kjent da den eldste jenta tiltaler henne.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Middagen på dørstokken</h2><p>Hun kommer sammen med den sju år gamle jenta til Ove med ris, safran og kylling. Den eldste forklarer at moren sendte middag fordi han så sulten ut. Begge løper deretter tilbake til den gravide kvinnens hus.</p></details><details><summary>En mann med navn Ove · 13</summary><h2>Søsteren og fortellingen på sykehuset</h2><p>Nasanin og storesøsteren er Parvanehs døtre; Parvaneh omtaler Patrick som faren deres. Mens moren besøker ham, får Nasanin Ove til å lese en bildebok om et tog. Hun forteller begeistret etter klovnens triks at Ove slo Beppo.</p></details><details><summary>En mann med navn Ove · 24</summary><h2>Ove i farger</h2><p>Nasanins tegning viser Ove i farger, mens resten er svart. Parvaneh gir ham tegningen og sier at datteren alltid tegner ham i farger fordi han er den morsomste hun vet.</p></details><details><summary>En mann med navn Ove · 36</summary><h2>Godnatthistorien</h2><p>Ove leser godnatthistorie for Nasanin. Hun sovner med hodet på armen hans og den åpne boken.</p></details><details><summary>En mann med navn Ove · 39</summary><h2>Morfar-navnet får bli</h2><p>Ove godtar jentenes morfar-navn og setter tegningene på kjøleskapet. Nasanin og søsteren hjelper til med pakkingen av Sonjas ting og sovner på sofaen etterpå.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Skolestart og smilefjes</h2><p>I epilogen er Nasanin blitt seks. Ove følger henne til første skoledag, og hun lærer ham smilefjes i SMS. Hans brev bestemmer én million til hvert av Parvanehs barn ved atten år.</p></details><details><summary>En mann med navn Ove · 3</summary><h2>Utseende</h2><p>Nasanin er svarthåret og har brune øyne.</p></details><details><summary>Illustration · En mann med navn Ove · 13</summary><p><a href="assets/54d4ba46f15896.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av lesestunden på sykehuset i kapittel 13.</p></details></noscript>
