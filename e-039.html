      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>En mann med navn Ove · 16</summary><h2>Introduction</h2><p>Sonjas far bor alene i et avsides trehus nordpå.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Skogshuset og velkomsten</h2><p>Faren bodde alene i et avsides trehus nordpå etter at Sonjas mor døde i barsel. Han giftet seg ikke igjen. Han bruker stokk og røyker pipe. Ernest kommer innom og følger ham på fisketurer.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Skogshuset og velkomsten</h2><p>Ved Oves første besøk får de to et felles tema gjennom Scania-lastebilen. Han lar Ove se på motoren og antyder senere at Ove får lære å fiske; Sonja oppfatter det som en stor kompliment.</p></details><details><summary>En mann med navn Ove · 18</summary><h2>Juninatten</h2><p>Etter at Ove har hjulpet med tak og lastebil gjennom to høster, dør faren en kjølig juninatt. Sonja er sterkt preget av tapet.</p></details><details><summary>En mann med navn Ove · 40</summary><h2>Pengene i epilogens brev</h2><p>Oves brev oppgir at pengene på kontoen stammer fra Sonjas far, som hadde aksjer. Beløpet oppgis til 11 563 013 kroner og 67 øre.</p></details><details><summary>En mann med navn Ove · 16</summary><h2>Stokken og pipen</h2><p>Faren bruker stokk og røyker pipe.</p></details><details><summary>Illustration · En mann med navn Ove · 16</summary><p><a href="assets/422d18514e4922.jpg">Open noncanonical illustration</a></p><p>Kunstnerisk tolkning av besøket hos Sonjas far i kapittel 16.</p></details></noscript>
